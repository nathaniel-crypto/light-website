<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mystical Realm | Arcane Powers</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        .info { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 100; pointer-events: none; }
        .info h1 { font-size: 2rem; font-weight: 700; letter-spacing: 8px; background: linear-gradient(135deg, #DA70D6, #9B30FF); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .info p { font-size: 0.7rem; letter-spacing: 4px; color: rgba(218,112,214,0.5); }
        .btn { position: fixed; bottom: 30px; left: 30px; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); border: 1px solid #DA70D6; padding: 12px 24px; color: #DA70D6; letter-spacing: 3px; font-size: 0.7rem; cursor: pointer; z-index: 100; clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%); transition: all 0.3s ease; }
        .btn:hover { letter-spacing: 5px; background: rgba(218,112,214,0.2); transform: translateX(5px); }
        .fps-counter { position: fixed; top: 20px; right: 20px; color: #00ff88; font-family: monospace; font-size: 11px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px; z-index: 100; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="info"><h1>🔮 MYSTICAL REALM 🔮</h1><p>Arcane Powers • Magic Energy</p></div>
    <button class="btn" id="backBtn">← BACK TO HUB</button>
    <div class="fps-counter" id="fps">FPS: --</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0520);
        scene.fog = new THREE.FogExp2(0x0a0520, 0.008);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 10);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.target.set(0, 1, 0);
        
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.3, 0.3, 0.85);
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // Mystical platform
        const platformGeo = new THREE.CylinderGeometry(3.5, 3.5, 0.2, 32);
        const platformMat = new THREE.MeshStandardMaterial({ color: 0x4B0082, metalness: 0.3, roughness: 0.5 });
        const platform = new THREE.Mesh(platformGeo, platformMat);
        platform.position.y = -0.6;
        scene.add(platform);
        
        // Magic crystal
        const crystalGeo = new THREE.ConeGeometry(0.6, 1.5, 8);
        const crystalMat = new THREE.MeshStandardMaterial({ color: 0xDA70D6, emissive: 0xDA70D6, emissiveIntensity: 0.6, metalness: 0.8 });
        const crystal = new THREE.Mesh(crystalGeo, crystalMat);
        crystal.position.y = 0.3;
        scene.add(crystal);
        
        // Floating energy orbs
        const orbCount = 8;
        const orbs = [];
        for (let i = 0; i < orbCount; i++) {
            const orbGeo = new THREE.SphereGeometry(0.12, 32, 32);
            const orbMat = new THREE.MeshStandardMaterial({ color: 0xDA70D6, emissive: 0xDA70D6 });
            const orb = new THREE.Mesh(orbGeo, orbMat);
            scene.add(orb);
            orbs.push(orb);
        }
        
        // Particles
        const particleCount = 5000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const radius = 1.5 + Math.random() * 3;
            const angle = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 4;
            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0xDA70D6, size: 0.04, blending: THREE.AdditiveBlending }));
        scene.add(particles);
        
        // Lights
        const ambientLight = new THREE.AmbientLight(0x1a0a2a);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xDA70D6, 1.0);
        mainLight.position.set(2, 5, 3);
        scene.add(mainLight);
        const crystalLight = new THREE.PointLight(0xDA70D6, 1.0);
        crystalLight.position.set(0, 0.6, 0);
        scene.add(crystalLight);
        
        let time = 0;
        let frameCount = 0;
        let lastTime = performance.now();
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            const pulse = 0.9 + Math.sin(time * 4) * 0.1;
            crystal.scale.set(pulse, pulse, pulse);
            crystalLight.intensity = 0.7 + Math.sin(time * 5) * 0.4;
            
            orbs.forEach((orb, i) => {
                const angle = time * 0.8 + (i / orbs.length) * Math.PI * 2;
                const radius = 2.2;
                orb.position.x = Math.cos(angle) * radius;
                orb.position.z = Math.sin(angle) * radius;
                orb.position.y = 0.5 + Math.sin(angle * 2) * 0.3;
            });
            
            particles.rotation.y += 0.002;
            controls.update();
            
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').innerHTML = `FPS: ${frameCount}`;
                frameCount = 0;
                lastTime = now;
            }
            
            effectComposer.render();
        }
        animate();
        
        document.getElementById('backBtn').addEventListener('click', () => {
            const flash = document.createElement('div');
            flash.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:#DA70D6;z-index:10001;opacity:0;transition:opacity 0.2s;pointer-events:none;`;
            document.body.appendChild(flash);
            setTimeout(() => flash.style.opacity = '1', 10);
            setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.remove(), 200); }, 200);
            setTimeout(() => { window.location.href = "gate-hub.html"; }, 400);
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
