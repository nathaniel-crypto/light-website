<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>INTERSTELLAR BLACK HOLE | 4K | REAL-TIME | CINEMATIC TRANSITION</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            overflow: hidden;
            font-family: 'Segoe UI', 'Space Grotesk', monospace;
        }
        #info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            border-left: 3px solid #ff3366;
        }
        #controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 12px;
        }
        button {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,51,102,0.6);
            color: #ff3366;
            padding: 12px 24px;
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
            letter-spacing: 2px;
        }
        button:hover {
            background: rgba(255,51,102,0.2);
            border-color: #ff3366;
            color: #ff6699;
            transform: scale(1.02);
        }
        .fps-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 4px;
            z-index: 100;
        }
        /* Transition overlay */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .transition-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        /* Crushing animation for content */
        .crushing {
            animation: crushEffect 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes crushEffect {
            0% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0px); }
            25% { transform: scale(0.6) rotate(5deg) translateX(-20px); opacity: 0.8; filter: blur(4px); }
            50% { transform: scale(0.2) rotate(15deg) translateX(-60px); opacity: 0.4; filter: blur(15px); }
            75% { transform: scale(0.05) rotate(25deg) translateX(-100px); opacity: 0.1; filter: blur(35px); }
            100% { transform: scale(0) rotate(35deg) translateX(-150px); opacity: 0; filter: blur(60px); display: none; }
        }
        @media (max-width: 768px) {
            button { padding: 8px 16px; font-size: 10px; }
            #info { font-size: 8px; bottom: 10px; left: 10px; }
        }
    </style>
</head>
<body>
    <div id="info">
        ⚡ GARGANTUA BLACK HOLE | 4K REAL-TIME | CINEMATIC ⚡
    </div>
    <div class="fps-counter" id="fps">FPS: --</div>
    <div id="controls">
        <button id="transitionBtn">🌀 ENTER BLACK HOLE 🌀</button>
    </div>
    <div class="transition-overlay" id="transitionOverlay"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // ============================================
        // SETUP
        // ============================================
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010105);
        scene.fog = new THREE.FogExp2(0x010105, 0.002);
        
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 1.2, 10);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.6;
        document.body.appendChild(renderer.domElement);
        
        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.enableZoom = true;
        controls.zoomSpeed = 0.5;
        controls.enablePan = false;
        controls.target.set(0, 0, 0);
        
        // Bloom
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.3, 0.3, 0.85);
        bloomPass.threshold = 0.05;
        bloomPass.strength = 1.1;
        bloomPass.radius = 0.8;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // ============================================
        // EVENT HORIZON
        // ============================================
        
        const eventHorizonGeo = new THREE.SphereGeometry(1.3, 512, 512);
        const eventHorizonMat = new THREE.MeshStandardMaterial({
            color: 0x000000,
            emissive: 0x1a0033,
            emissiveIntensity: 0.4,
            metalness: 0.98,
            roughness: 0.05
        });
        const eventHorizon = new THREE.Mesh(eventHorizonGeo, eventHorizonMat);
        scene.add(eventHorizon);
        
        // Photon sphere
        const photonGeo = new THREE.SphereGeometry(1.48, 512, 512);
        const photonMat = new THREE.MeshBasicMaterial({
            color: 0xff3366,
            transparent: true,
            opacity: 0.14,
            side: THREE.BackSide
        });
        const photonSphere = new THREE.Mesh(photonGeo, photonMat);
        scene.add(photonSphere);
        
        // ============================================
        // ACCRETION DISK - 5 LAYERS
        // ============================================
        
        // Inner hot disk
        const innerDiskGeo = new THREE.TorusGeometry(2.1, 0.2, 512, 1024);
        const innerDiskMat = new THREE.MeshStandardMaterial({
            color: 0xff4488,
            emissive: 0xff2266,
            emissiveIntensity: 0.95,
            metalness: 0.94,
            roughness: 0.18,
            transparent: true,
            opacity: 0.96
        });
        const innerDisk = new THREE.Mesh(innerDiskGeo, innerDiskMat);
        innerDisk.rotation.x = Math.PI / 2.15;
        innerDisk.rotation.z = 0.3;
        scene.add(innerDisk);
        
        // Mid disk
        const midDiskGeo = new THREE.TorusGeometry(2.9, 0.18, 512, 1024);
        const midDiskMat = new THREE.MeshStandardMaterial({
            color: 0xff6644,
            emissive: 0xff4422,
            emissiveIntensity: 0.75,
            metalness: 0.9,
            roughness: 0.24,
            transparent: true,
            opacity: 0.9
        });
        const midDisk = new THREE.Mesh(midDiskGeo, midDiskMat);
        midDisk.rotation.x = Math.PI / 2.1;
        midDisk.rotation.z = -0.2;
        scene.add(midDisk);
        
        // Outer disk
        const outerDiskGeo = new THREE.TorusGeometry(3.7, 0.16, 512, 1024);
        const outerDiskMat = new THREE.MeshStandardMaterial({
            color: 0xff8855,
            emissive: 0xff6633,
            emissiveIntensity: 0.6,
            metalness: 0.86,
            roughness: 0.3,
            transparent: true,
            opacity: 0.85
        });
        const outerDisk = new THREE.Mesh(outerDiskGeo, outerDiskMat);
        outerDisk.rotation.x = Math.PI / 2.05;
        outerDisk.rotation.z = 0.15;
        scene.add(outerDisk);
        
        // Extremely hot ring
        const hotRingGeo = new THREE.TorusGeometry(1.6, 0.08, 512, 1024);
        const hotRingMat = new THREE.MeshStandardMaterial({
            color: 0xffaa88,
            emissive: 0xff6644,
            emissiveIntensity: 1.3,
            metalness: 0.97,
            roughness: 0.1
        });
        const hotRing = new THREE.Mesh(hotRingGeo, hotRingMat);
        hotRing.rotation.x = Math.PI / 2.2;
        scene.add(hotRing);
        
        // Gravitational lensing ring
        const lensGeo = new THREE.TorusGeometry(2.4, 0.05, 512, 1024);
        const lensMat = new THREE.MeshStandardMaterial({
            color: 0xffaa99,
            emissive: 0xff6644,
            emissiveIntensity: 0.7,
            transparent: true,
            opacity: 0.7
        });
        const lensRing = new THREE.Mesh(lensGeo, lensMat);
        lensRing.rotation.x = Math.PI / 2;
        scene.add(lensRing);
        
        // ============================================
        // PARTICLE SYSTEMS
        // ============================================
        
        // Main particle disk (80,000 particles)
        const particleCount = 80000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleColorsArray = new Float32Array(particleCount * 3);
        
        for (let i = 0; i < particleCount; i++) {
            const radius = 1.6 + Math.random() * 4.2;
            const angle = Math.random() * Math.PI * 2;
            const yOffset = (Math.random() - 0.5) * 1.3;
            
            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = yOffset;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
            
            const t = Math.random();
            if (t < 0.35) {
                particleColorsArray[i * 3] = 1.0;
                particleColorsArray[i * 3 + 1] = 0.6 + Math.random() * 0.3;
                particleColorsArray[i * 3 + 2] = 0.3 + Math.random() * 0.3;
            } else if (t < 0.65) {
                particleColorsArray[i * 3] = 1.0;
                particleColorsArray[i * 3 + 1] = 0.4 + Math.random() * 0.3;
                particleColorsArray[i * 3 + 2] = 0.5 + Math.random() * 0.4;
            } else {
                particleColorsArray[i * 3] = 0.9;
                particleColorsArray[i * 3 + 1] = 0.3 + Math.random() * 0.3;
                particleColorsArray[i * 3 + 2] = 1.0;
            }
        }
        
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColorsArray, 3));
