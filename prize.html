<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🏆 THE ULTIMATE PRIZE 🏆</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        
        .prize-container {
            position: relative;
            z-index: 100;
            text-align: center;
            max-width: 800px;
            padding: 40px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 2px solid #FFD700;
            box-shadow: 0 0 80px rgba(255,215,0,0.3);
            animation: glowPulse 2s infinite;
            margin: 20px;
        }
        
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(255,215,0,0.3); border-color: #FFD700; }
            50% { box-shadow: 0 0 80px rgba(255,215,0,0.6); border-color: #FFD700; }
        }
        
        .prize-icon { font-size: 5rem; animation: bounce 1s infinite; display: inline-block; margin-bottom: 20px; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        
        h1 { font-size: 2.5rem; letter-spacing: 8px; background: linear-gradient(135deg, #FFD700, #FF1493, #00FFFF); background-clip: text; -webkit-background-clip: text; color: transparent; margin-bottom: 20px; }
        
        .prize-reveal { font-size: 1.5rem; color: #FFD700; margin: 30px 0; text-shadow: 0 0 10px #FFD700; }
        .prize-description { font-size: 1rem; color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 30px; }
        
        .btn-group { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .btn { background: rgba(255,215,0,0.2); border: 1px solid #FFD700; padding: 12px 30px; color: #FFD700; cursor: pointer; border-radius: 40px; transition: all 0.3s ease; font-weight: bold; letter-spacing: 2px; text-decoration: none; font-family: 'Space Grotesk', sans-serif; }
        .btn:hover { background: #FFD700; color: #000; transform: scale(1.05); box-shadow: 0 0 30px #FFD700; }
        .btn-primary { background: linear-gradient(135deg, #FFD700, #FF1493); border: none; color: white; }
        .btn-primary:hover { background: linear-gradient(135deg, #FF1493, #FFD700); letter-spacing: 4px; }
        
        .badge-container { display: flex; justify-content: center; gap: 20px; margin: 30px 0; flex-wrap: wrap; }
        .badge { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; background: rgba(0,0,0,0.6); border: 2px solid #FFD700; }
        .badge.completed { background: #FFD700; color: #000; box-shadow: 0 0 20px #FFD700; }
        
        .fps-counter { position: fixed; top: 20px; right: 20px; color: #00ff88; font-family: monospace; font-size: 11px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px; z-index: 100; }
        
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; letter-spacing: 4px; }
            .prize-reveal { font-size: 1rem; }
            .prize-container { padding: 20px; margin: 10px; }
            .badge { width: 50px; height: 50px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="prize-container">
    <div class="prize-icon">🏆</div>
    <h1>THE ULTIMATE PRIZE</h1>
    <div class="badge-container">
        <div class="badge" id="ancientBadge">🏛️</div>
        <div class="badge" id="mysticalBadge">🔮</div>
        <div class="badge" id="spaceBadge">🌌</div>
    </div>
    <div class="prize-reveal" id="prizeReveal">✦ YOU HAVE MASTERED ALL GATES ✦</div>
    <div class="prize-description">
        <p>🌟 You have proven your wisdom, memory, and cosmic knowledge! 🌟</p>
        <p>✨ As a reward, you now have access to the <strong>MASTER REALM</strong> ✨</p>
        <p>🌀 A place where all light converges - the ultimate experience awaits! 🌀</p>
    </div>
    <div class="btn-group">
        <button class="btn" id="backBtn">← BACK TO HUB</button>
        <button class="btn btn-primary" id="masterRealmBtn">🌟 ENTER MASTER REALM 🌟</button>
    </div>
</div>

<div class="fps-counter" id="fps">FPS: --</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    
    // 3D Celebration Background
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050520);
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 10);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;
    controls.target.set(0, 0, 0);
    
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.9);
    const effectComposer = new EffectComposer(renderer);
    effectComposer.addPass(renderScene);
    effectComposer.addPass(bloomPass);
    
    // Celebration orbs
    const orbCount = 50;
    const orbs = [];
    for (let i = 0; i < orbCount; i++) {
        const orbGeo = new THREE.SphereGeometry(0.1, 16, 16);
        const orbMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xFF6600 });
        const orb = new THREE.Mesh(orbGeo, orbMat);
        orb.position.x = (Math.random() - 0.5) * 15;
        orb.position.y = (Math.random() - 0.5) * 8;
        orb.position.z = (Math.random() - 0.5) * 10 - 5;
        scene.add(orb);
        orbs.push({ mesh: orb, velX: (Math.random() - 0.5) * 0.02, velY: (Math.random() - 0.5) * 0.02, velZ: (Math.random() - 0.5) * 0.02 });
    }
    
    // Central glowing trophy
    const trophyGeo = new THREE.CylinderGeometry(0.8, 0.8, 1.5, 32);
    const trophyMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xFF6600, emissiveIntensity: 0.5 });
    const trophy = new THREE.Mesh(trophyGeo, trophyMat);
    trophy.position.y = 0;
    scene.add(trophy);
    
    const starGeo = new THREE.SphereGeometry(0.15, 16, 16);
    const starMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xFF6600 });
    const star = new THREE.Mesh(starGeo, starMat);
    star.position.y = 1;
    scene.add(star);
    
    // Lights
    const ambientLight = new THREE.AmbientLight(0x222233);
    scene.add(ambientLight);
    const mainLight = new THREE.DirectionalLight(0xFFD700, 1);
    mainLight.position.set(2, 5, 3);
    scene.add(mainLight);
    const colorLight = new THREE.PointLight(0xFFD700, 1);
    colorLight.position.set(0, 1, 0);
    scene.add(colorLight);
    
    let time = 0;
    let frameCount = 0;
    let lastTime = performance.now();
    
    function animate() {
        requestAnimationFrame(animate);
        time += 0.016;
        
        const pulse = 0.9 + Math.sin(time * 5) * 0.1;
        trophy.scale.set(pulse, pulse, pulse);
        star.scale.set(pulse, pulse, pulse);
        colorLight.intensity = 0.8 + Math.sin(time * 6) * 0.4;
        
        orbs.forEach(orb => {
            orb.mesh.position.x += orb.velX;
            orb.mesh.position.y += orb.velY;
            orb.mesh.position.z += orb.velZ;
            if (Math.abs(orb.mesh.position.x) > 8) orb.velX *= -1;
            if (Math.abs(orb.mesh.position.y) > 5) orb.velY *= -1;
            if (Math.abs(orb.mesh.position.z) > 8) orb.velZ *= -1;
        });
        
        controls.update();
        
        frameCount++;
        const now = performance.now();
        if (now - lastTime >= 1000) {
            document.getElementById('fps').innerHTML = `FPS: ${frameCount}`;
            frameCount = 0;
            lastTime = now;
        }
        
        effectComposer.render();
    }
    animate();
    
    // UI Logic
    const completedGates = JSON.parse(localStorage.getItem('completedGates') || '{"ancient":false,"mystical":false,"space":false}');
    
    const ancientBadge = document.getElementById('ancientBadge');
    const mysticalBadge = document.getElementById('mysticalBadge');
    const spaceBadge = document.getElementById('spaceBadge');
    
    if (completedGates.ancient) ancientBadge.classList.add('completed');
    if (completedGates.mystical) mysticalBadge.classList.add('completed');
    if (completedGates.space) spaceBadge.classList.add('completed');
    
    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = "gate-hub.html";
    });
    
    document.getElementById('masterRealmBtn').addEventListener('click', () => {
        window.location.href = "master-realm.html";
    });
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        effectComposer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
