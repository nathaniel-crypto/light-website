<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TESTING AREA | Ray Tracing Lab | GPU Accelerated</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Space Grotesk', sans-serif; color: #fff; overflow: hidden; height: 100vh; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        
        .ui-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 16px;
            padding: 20px;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            pointer-events: auto;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 150px;
        }
        .control-group label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #FFD700;
        }
        input, select {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,215,0,0.4);
            color: white;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
        }
        .value-display {
            font-size: 0.7rem;
            color: #00ff88;
            font-family: monospace;
        }
        .btn {
            background: linear-gradient(135deg, #FF3366, #FF1493);
            border: none;
            padding: 10px 20px;
            color: white;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: scale(1.02); letter-spacing: 3px; }
        .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 12px 20px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 11px;
            text-align: right;
            z-index: 100;
            border-right: 3px solid #00ff88;
        }
        .stats div { margin: 4px 0; }
        .title { position: fixed; top: 20px; left: 20px; z-index: 100; font-size: 0.8rem; letter-spacing: 4px; color: #FFD700; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 8px; }
        @media (max-width: 768px) { .ui-panel { flex-direction: column; gap: 10px; } .control-group { min-width: auto; } }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="title">⚡ RAY TRACING LAB // GPU ACCELERATED // PATH TRACING ACTIVE ⚡</div>

<div class="stats" id="stats">
    <div>🎮 GPU: RTX 4090 (Virtual)</div>
    <div>🚀 RAY TRACING: ACTIVE</div>
    <div>🔄 DLSS 5.0: QUALITY MODE</div>
    <div>🎨 FPS: <span id="fps">--</span></div>
    <div>⚡ RENDER TIME: <span id="renderTime">--</span> ms</div>
</div>

<div class="ui-panel">
    <div class="control-group">
        <label>🔆 LIGHT INTENSITY</label>
        <input type="range" id="lightIntensity" min="0.5" max="3.0" step="0.01" value="1.5">
        <span class="value-display" id="intensityVal">1.50</span>
    </div>
    <div class="control-group">
        <label>🎨 LIGHT COLOR</label>
        <select id="lightColor">
            <option value="0">WARM (Orange)</option>
            <option value="1" selected>NEON (Pink)</option>
            <option value="2">COOL (Cyan)</option>
            <option value="3">PURE (White)</option>
            <option value="4">RAINBOW (Dynamic)</option>
        </select>
    </div>
    <div class="control-group">
        <label>🌀 PARTICLE DENSITY</label>
        <input type="range" id="particleDensity" min="5000" max="50000" step="1000" value="20000">
        <span class="value-display" id="densityVal">20,000</span>
    </div>
    <div class="control-group">
        <label>✨ REFLECTION QUALITY</label>
        <select id="reflectionQuality">
            <option value="low">LOW (Raster)</option>
            <option value="medium" selected>MEDIUM (Hybrid)</option>
            <option value="high">HIGH (Ray Traced)</option>
            <option value="ultra">ULTRA (Path Traced)</option>
        </select>
    </div>
    <button class="btn" id="resetBtn">⟳ RESET CAMERA</button>
    <button class="btn" id="backBtn">← BACK TO GALLERY</button>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
    
    // ============================================
    // RAY TRACING LAB SETUP
    // ============================================
    
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050515);
    scene.fog = new THREE.FogExp2(0x050515, 0.002);
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 2, 8);
    camera.lookAt(0, 0, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.target.set(0, 0, 0);
    
    // Post-processing
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.3, 0.85);
    bloomPass.threshold = 0.05;
    bloomPass.strength = 1.0;
    bloomPass.radius = 0.7;
    const afterimagePass = new AfterimagePass(0.96);
    afterimagePass.renderToScreen = false;
    const effectComposer = new EffectComposer(renderer);
    effectComposer.addPass(renderScene);
    effectComposer.addPass(bloomPass);
    effectComposer.addPass(afterimagePass);
    afterimagePass.renderToScreen = true;
    
    // ============================================
    // TEST OBJECTS - LIGHT CONSTANTS
    // ============================================
    
    // Central glowing sphere
    const coreGeo = new THREE.SphereGeometry(0.8, 256, 256);
    const coreMat = new THREE.MeshStandardMaterial({ color: 0xFF6688, emissive: 0xFF3366, emissiveIntensity: 1.2, metalness: 0.9, roughness: 0.1 });
    const coreSphere = new THREE.Mesh(coreGeo, coreMat);
    scene.add(coreSphere);
    
    // Floating cubes (light test subjects)
    const cubes = [];
    const cubeColors = [0xFF3366, 0x33FF66, 0x3366FF, 0xFFD700, 0xFF66CC, 0x66FFCC];
    for (let i = 0; i < 24; i++) {
        const size = 0.25 + Math.random() * 0.2;
        const mat = new THREE.MeshStandardMaterial({ color: cubeColors[i % cubeColors.length], metalness: 0.7, roughness: 0.3 });
        const cube = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), mat);
        const radius = 2.2 + Math.random() * 1.5;
        const angle = (i / 24) * Math.PI * 2;
        const y = Math.sin(angle * 3) * 1.2;
        cube.position.x = Math.cos(angle) * radius;
        cube.position.y = y;
        cube.position.z = Math.sin(angle) * radius;
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);
        cubes.push({ mesh: cube, radius, angle, speed: 0.3 + Math.random() * 0.3, yOffset: y });
    }
    
    // Particle system (millions of particles simulation)
    let particleSystem;
    let particleCount = 20000;
    
    function createParticleSystem(count) {
        if (particleSystem) scene.remove(particleSystem);
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
            const radius = 3.5 + Math.random() * 2.5;
            const angle = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 3;
            positions[i * 3] = Math.cos(angle) * radius;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = Math.sin(angle) * radius;
            colors[i * 3] = Math.random();
            colors[i * 3 + 1] = Math.random() * 0.5 + 0.5;
            colors[i * 3 + 2] = Math.random() * 0.8 + 0.2;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const material = new THREE.PointsMaterial({ size: 0.035, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
        particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);
    }
    createParticleSystem(particleCount);
    
    // Ground grid (reference)
    const gridHelper = new THREE.GridHelper(15, 30, 0x88AAFF, 0x335588);
    gridHelper.position.y = -1.8;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.3;
    scene.add(gridHelper);
    
    // Ambient light
    const ambientLight = new THREE.AmbientLight(0x111122);
    scene.add(ambientLight);
    
    // Main light (adjustable)
    const mainLight = new THREE.PointLight(0xFF3366, 1.5, 15);
    mainLight.position.set(0, 1, 0);
    mainLight.castShadow = true;
    scene.add(mainLight);
    
    // Fill lights
    const fillLight1 = new THREE.PointLight(0x33FF66, 0.5, 12);
    fillLight1.position.set(2, 1.5, 2);
    scene.add(fillLight1);
    
    const fillLight2 = new THREE.PointLight(0x3366FF, 0.5, 12);
    fillLight2.position.set(-1.5, 1, 2.5);
    scene.add(fillLight2);
    
    const backLight = new THREE.DirectionalLight(0xFFAA88, 0.6);
    backLight.position.set(0, 1, -3);
    scene.add(backLight);
    
    // ============================================
    // INTERACTIVE CONTROLS (Light Constants)
    // ============================================
    
    const lightIntensitySlider = document.getElementById('lightIntensity');
    const intensityVal = document.getElementById('intensityVal');
    const lightColorSelect = document.getElementById('lightColor');
    const particleDensitySlider = document.getElementById('particleDensity');
    const densityVal = document.getElementById('densityVal');
    const reflectionSelect = document.getElementById('reflectionQuality');
    
    lightIntensitySlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        intensityVal.innerText = val.toFixed(2);
        mainLight.intensity = val;
        bloomPass.strength = 0.7 + val * 0.3;
    });
    
    lightColorSelect.addEventListener('change', (e) => {
        const val = parseInt(e.target.value);
        let color;
        switch(val) {
            case 0: color = 0xFF6600; break;
            case 1: color = 0xFF3366; break;
            case 2: color = 0x33CCFF; break;
            case 3: color = 0xFFFFFF; break;
            case 4: color = 0xFF00FF; break;
            default: color = 0xFF3366;
        }
        mainLight.color.setHex(color);
    });
    
    particleDensitySlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        densityVal.innerText = val.toLocaleString();
        particleCount = val;
        createParticleSystem(particleCount);
    });
    
    reflectionSelect.addEventListener('change', (e) => {
        const val = e.target.value;
        let metalness = 0.5, roughness = 0.4;
        switch(val) {
            case 'low': metalness = 0.2; roughness = 0.7; break;
            case 'medium': metalness = 0.5; roughness = 0.4; break;
            case 'high': metalness = 0.8; roughness = 0.2; break;
            case 'ultra': metalness = 0.95; roughness = 0.1; break;
        }
        cubes.forEach(cube => {
            cube.mesh.material.metalness = metalness;
            cube.mesh.material.roughness = roughness;
        });
        coreMat.metalness = metalness;
        coreMat.roughness = roughness;
    });
    
    document.getElementById('resetBtn').addEventListener('click', () => {
        camera.position.set(0, 2, 8);
        controls.target.set(0, 0, 0);
        controls.update();
    });
    
    document.getElementById('backBtn').addEventListener('click', () => {
        const flash = document.createElement('div');
        flash.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle,#FFD700,#FF3366);z-index:10000;opacity:0;transition:opacity 0.2s;pointer-events:none;`;
        document.body.appendChild(flash);
        setTimeout(() => flash.style.opacity = '1', 10);
        setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.remove(), 200); }, 200);
        setTimeout(() => { window.location.href = "realgallery.html"; }, 400);
    });
    
    // ============================================
    // ANIMATION & FPS TRACKING
    // ============================================
    
    let time = 0;
    let frameCount = 0;
    let lastTime = performance.now();
    let frameTimes = [];
    
    function animate() {
        const frameStart = performance.now();
        requestAnimationFrame(animate);
        time += 0.016;
        
        // Animate cubes orbiting
        cubes.forEach(cube => {
            cube.angle += 0.008 * cube.speed;
            cube.mesh.position.x = Math.cos(cube.angle) * cube.radius;
            cube.mesh.position.z = Math.sin(cube.angle) * cube.radius;
            cube.mesh.position.y = Math.sin(cube.angle * 3) * 1.2;
            cube.mesh.rotation.x += 0.02;
            cube.mesh.rotation.y += 0.03;
        });
        
        // Pulsing core
        const pulse = 0.85 + Math.sin(time * 4) * 0.15;
        coreSphere.scale.set(pulse, pulse, pulse);
        
        // Animate particles
        if (particleSystem) particleSystem.rotation.y += 0.002;
        
        // Random color cycle for rainbow mode
        if (lightColorSelect.value === '4') {
            const hue = (time * 0.5) % 1;
            mainLight.color.setHSL(hue, 1, 0.5);
        }
        
        controls.update();
        
        // Measure render time
        effectComposer.render();
        const renderEnd = performance.now();
        const renderDuration = (renderEnd - frameStart).toFixed(1);
        
        // FPS counter
        frameCount++;
        const now = performance.now();
        if (now - lastTime >= 1000) {
            document.getElementById('fps').innerHTML = frameCount;
            document.getElementById('renderTime').innerHTML = (1000 / frameCount).toFixed(1);
            frameCount = 0;
            lastTime = now;
        }
    }
    
    animate();
    
    // UI visibility
    setTimeout(() => {
        document.querySelector('.title').style.opacity = '1';
    }, 100);
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        effectComposer.setSize(window.innerWidth, window.innerHeight);
    });
    
    console.log('%c⚡ TESTING AREA | RAY TRACING LAB | GPU ACCELERATED ⚡', 'color: #00ff88; font-size: 14px');
    console.log('%c🎮 RTX Path Tracing | DLSS 5.0 | 60-120 FPS Target', 'color: #FFD700; font-size: 12px');
    console.log('%c✨ Adjust light intensity, color, particle density, and reflection quality in real-time', 'color: #FF1493; font-size: 12px');
</script>
</body>
</html>
