<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Space Realm | Cosmic Wonders</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        .info { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 100; pointer-events: none; }
        .info h1 { font-size: 2rem; font-weight: 700; letter-spacing: 8px; background: linear-gradient(135deg, #00FFFF, #0066FF); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .info p { font-size: 0.7rem; letter-spacing: 4px; color: rgba(0,255,255,0.5); }
        .btn { position: fixed; bottom: 30px; left: 30px; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); border: 1px solid #00FFFF; padding: 12px 24px; color: #00FFFF; letter-spacing: 3px; font-size: 0.7rem; cursor: pointer; z-index: 100; clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%); transition: all 0.3s ease; }
        .btn:hover { letter-spacing: 5px; background: rgba(0,255,255,0.2); transform: translateX(5px); }
        .fps-counter { position: fixed; top: 20px; right: 20px; color: #00ff88; font-family: monospace; font-size: 11px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px; z-index: 100; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="info"><h1>🌌 SPACE REALM 🌌</h1><p>Cosmic Wonders • Infinite Stars</p></div>
    <button class="btn" id="backBtn">← BACK TO HUB</button>
    <div class="fps-counter" id="fps">FPS: --</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010118);
        scene.fog = new THREE.FogExp2(0x010118, 0.005);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 12);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.target.set(0, 0, 0);
        
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.3, 0.9);
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // Central star
        const starCoreGeo = new THREE.SphereGeometry(0.8, 128, 128);
        const starCoreMat = new THREE.MeshStandardMaterial({ color: 0x00FFFF, emissive: 0x00FFFF, emissiveIntensity: 0.8 });
        const starCore = new THREE.Mesh(starCoreGeo, starCoreMat);
        scene.add(starCore);
        
        // Orbiting planets (rings)
        const ring1Geo = new THREE.TorusGeometry(1.4, 0.05, 128, 256);
        const ring1Mat = new THREE.MeshStandardMaterial({ color: 0x00FFFF, emissive: 0x00FFFF });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        scene.add(ring1);
        
        const ring2Geo = new THREE.TorusGeometry(1.9, 0.06, 128, 256);
        const ring2Mat = new THREE.MeshStandardMaterial({ color: 0x33CCFF, emissive: 0x33CCFF });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        scene.add(ring2);
        
        const ring3Geo = new THREE.TorusGeometry(2.4, 0.07, 128, 256);
        const ring3Mat = new THREE.MeshStandardMaterial({ color: 0x66AAFF, emissive: 0x66AAFF });
        const ring3 = new THREE.Mesh(ring3Geo, ring3Mat);
        scene.add(ring3);
        
        // Small orbiting spheres (planets)
        const planetCount = 12;
        const planets = [];
        for (let i = 0; i < planetCount; i++) {
            const planetGeo = new THREE.SphereGeometry(0.12, 32, 32);
            const planetMat = new THREE.MeshStandardMaterial({ color: 0x88CCFF, emissive: 0x44AAFF });
            const planet = new THREE.Mesh(planetGeo, planetMat);
            scene.add(planet);
            planets.push(planet);
        }
        
        // Particles (stars)
        const particleCount = 8000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const radius = 2 + Math.random() * 5;
            const angle = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 5;
            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0x88AACC, size: 0.04, blending: THREE.AdditiveBlending }));
        scene.add(particles);
        
        // Distant starfield
        const starCount = 5000;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i * 3] = (Math.random() - 0.5) * 200;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 100;
            starPositions[i * 3 + 2] = (Math.random() - 0.5) * 100 - 50;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.06, transparent: true, opacity: 0.4 }));
        scene.add(stars);
        
        // Lights
        const ambientLight = new THREE.AmbientLight(0x111122);
        scene.add(ambientLight);
        const coreLight = new THREE.PointLight(0x00FFFF, 1.5, 25);
        coreLight.position.set(0, 0, 0);
        scene.add(coreLight);
        
        let time = 0;
        let frameCount = 0;
        let lastTime = performance.now();
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            const pulse = 0.9 + Math.sin(time * 4) * 0.1;
            starCore.scale.set(pulse, pulse, pulse);
            coreLight.intensity = 1.0 + Math.sin(time * 5) * 0.4;
            
            ring1.rotation.z += 0.008;
            ring2.rotation.z -= 0.006;
            ring3.rotation.z += 0.005;
            
            planets.forEach((planet, i) => {
                const angle = time * 0.5 + (i / planets.length) * Math.PI * 2;
                const radius = 2.0;
                planet.position.x = Math.cos(angle) * radius;
                planet.position.z = Math.sin(angle) * radius;
                planet.position.y = Math.sin(angle * 2) * 0.5;
            });
            
            particles.rotation.y += 0.001;
            stars.rotation.y += 0.0002;
            controls.update();
            
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').innerHTML = `FPS: ${frameCount}`;
                frameCount = 0;
                lastTime = now;
            }
            
            effectComposer.render();
        }
        animate();
        
        document.getElementById('backBtn').addEventListener('click', () => {
            const flash = document.createElement('div');
            flash.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:#00FFFF;z-index:10001;opacity:0;transition:opacity 0.2s;pointer-events:none;`;
            document.body.appendChild(flash);
            setTimeout(() => flash.style.opacity = '1', 10);
            setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.remove(), 200); }, 200);
            setTimeout(() => { window.location.href = "gate-hub.html"; }, 400);
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
