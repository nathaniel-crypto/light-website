<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GATE HUB | Ancient • Mystical • Space</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000000; font-family: 'Space Grotesk', sans-serif; color: #ffffff; overflow: hidden; height: 100vh; width: 100vw; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        
        .ui-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle, transparent 0%, rgba(0,0,0,0.6) 100%); pointer-events: none; }
        
        .title { text-align: center; margin-bottom: 60px; opacity: 0; transform: translateY(-30px); transition: all 1s ease; }
        .title h1 { font-size: 3rem; font-weight: 800; letter-spacing: 12px; background: linear-gradient(135deg, #FFD700, #FF1493, #00FFFF); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .title p { font-size: 0.8rem; letter-spacing: 6px; color: rgba(255,255,255,0.6); margin-top: 1rem; }
        .title.visible { opacity: 1; transform: translateY(0); }
        
        .gate-container { display: flex; gap: 60px; justify-content: center; align-items: center; flex-wrap: wrap; pointer-events: auto; margin-bottom: 40px; }
        
        .gate-card { width: 280px; height: 280px; cursor: pointer; position: relative; opacity: 0; transform: scale(0.8); transition: all 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1); border-radius: 50%; }
        .gate-card.visible { opacity: 1; transform: scale(1); }
        .gate-card:hover { transform: scale(1.05) translateY(-10px); filter: drop-shadow(0 0 30px rgba(255,215,0,0.5)); }
        .gate-card.completed { filter: drop-shadow(0 0 30px #00FF88); border-color: #00FF88; }
        .gate-card.completed .gate-frame { border-color: #00FF88; box-shadow: 0 0 30px #00FF88; }
        .gate-card.completed .gate-overlay h2 { color: #00FF88; }
        
        /* Completed checkmark */
        .completed-badge { position: absolute; top: -15px; right: -15px; width: 50px; height: 50px; background: #00FF88; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: #000; box-shadow: 0 0 20px #00FF88; z-index: 10; animation: badgePulse 1s infinite; }
        @keyframes badgePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        .gate-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 3px solid rgba(255,215,0,0.5); box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,215,0,0.2); }
        
        .gate-ancient .gate-frame { background: radial-gradient(circle at 30% 40%, #DAA520, #8B5A2B, #4A2A0A); }
        .gate-mystical .gate-frame { background: radial-gradient(circle at 30% 40%, #DA70D6, #8B008B, #4B0082); }
        .gate-space .gate-frame { background: radial-gradient(circle at 30% 40%, #00BFFF, #00008B, #00001A); }
        .gate-space .gate-frame::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)); background-size: 150px 150px; opacity: 0.5; border-radius: 50%; }
        
        .gate-ring { position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; border-radius: 50%; border: 2px solid rgba(255,215,0,0.3); animation: pulseRing 2s infinite; pointer-events: none; }
        @keyframes pulseRing { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.05); opacity: 1; } }
        
        .gate-overlay { position: absolute; bottom: -50px; left: 0; right: 0; text-align: center; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); padding: 15px; border-radius: 30px; margin: 0 20px; border-top: 1px solid rgba(255,215,0,0.3); }
        .gate-overlay h2 { font-size: 1.2rem; letter-spacing: 4px; margin-bottom: 5px; }
        .gate-overlay p { font-size: 0.55rem; letter-spacing: 2px; color: rgba(255,255,255,0.6); }
        .gate-overlay .icon { font-size: 1.8rem; margin-bottom: 5px; display: block; }
        
        .gate-ancient .gate-overlay h2 { color: #DAA520; }
        .gate-mystical .gate-overlay h2 { color: #DA70D6; }
        .gate-space .gate-overlay h2 { color: #00FFFF; }
        
        .prize-container { text-align: center; margin-top: 60px; opacity: 0; transform: translateY(20px); transition: all 0.5s ease; pointer-events: auto; }
        .prize-container.visible { opacity: 1; transform: translateY(0); }
        .prize-btn { background: linear-gradient(135deg, #FFD700, #FF1493, #00FFFF); border: none; padding: 15px 40px; color: white; font-weight: bold; letter-spacing: 4px; font-size: 1rem; cursor: pointer; border-radius: 50px; transition: all 0.3s ease; font-family: 'Space Grotesk', sans-serif; box-shadow: 0 0 20px rgba(255,215,0,0.5); }
        .prize-btn:hover { transform: scale(1.05); letter-spacing: 6px; box-shadow: 0 0 40px rgba(255,215,0,0.8); }
        
        .completion-text { color: #00FF88; font-size: 0.8rem; letter-spacing: 2px; margin-top: 10px; }
        
        .back-btn { position: fixed; bottom: 30px; left: 30px; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,215,0,0.5); padding: 12px 24px; color: #FFD700; letter-spacing: 3px; font-size: 0.7rem; cursor: pointer; z-index: 100; clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%); transition: all 0.3s ease; }
        .back-btn:hover { letter-spacing: 5px; background: rgba(255,215,0,0.2); transform: translateX(5px); }
        
        .fps-counter { position: fixed; top: 20px; right: 20px; color: #00ff88; font-family: monospace; font-size: 11px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px; z-index: 100; }
        .transition-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        .transition-overlay.active { opacity: 1; pointer-events: all; }
        
        @media (max-width: 900px) {
            .gate-container { gap: 40px; }
            .gate-card { width: 220px; height: 220px; }
            .gate-overlay { bottom: -40px; padding: 10px; }
            .title h1 { font-size: 1.8rem; letter-spacing: 6px; }
        }
        @media (max-width: 700px) {
            .gate-container { flex-direction: column; gap: 70px; }
            .gate-card { width: 240px; height: 240px; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="ui-overlay">
    <div class="title" id="title">
        <h1>✦ GATE HUB ✦</h1>
        <p>CHOOSE YOUR PATH • COMPLETE ALL TRIALS</p>
    </div>
    
    <div class="gate-container">
        <div class="gate-card gate-ancient" id="ancientGate" data-gate="ancient">
            <div class="gate-frame"></div>
            <div class="gate-ring"></div>
            <div class="gate-overlay">
                <span class="icon">🏛️</span>
                <h2>ANCIENT GATE</h2>
                <p>Realm of Wisdom • Solve the Riddle</p>
            </div>
        </div>
        
        <div class="gate-card gate-mystical" id="mysticalGate" data-gate="mystical">
            <div class="gate-frame"></div>
            <div class="gate-ring"></div>
            <div class="gate-overlay">
                <span class="icon">🔮</span>
                <h2>MYSTICAL GATE</h2>
                <p>Realm of Magic • Memory Challenge</p>
            </div>
        </div>
        
        <div class="gate-card gate-space" id="spaceGate" data-gate="space">
            <div class="gate-frame"></div>
            <div class="gate-ring"></div>
            <div class="gate-overlay">
                <span class="icon">🌌</span>
                <h2>SPACE GATE</h2>
                <p>Realm of Cosmos • Symbol Puzzle</p>
            </div>
        </div>
    </div>
    
    <div class="prize-container" id="prizeContainer">
        <button class="prize-btn" id="prizeBtn">🏆 CLAIM YOUR PRIZE 🏆</button>
        <div class="completion-text" id="completionText"></div>
    </div>
</div>

<button class="back-btn" id="backBtn">← BACK TO TESTING</button>
<div class="transition-overlay" id="transitionOverlay"></div>
<div class="fps-counter" id="fps">FPS: --</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    
    // Load completed gates from localStorage
    let completedGates = JSON.parse(localStorage.getItem('completedGates') || '{"ancient":false,"mystical":false,"space":false}');
    
    function updateGateCompletionUI() {
        const ancientGate = document.getElementById('ancientGate');
        const mysticalGate = document.getElementById('mysticalGate');
        const spaceGate = document.getElementById('spaceGate');
        
        if (completedGates.ancient) {
            ancientGate.classList.add('completed');
            if (!ancientGate.querySelector('.completed-badge')) {
                const badge = document.createElement('div');
                badge.className = 'completed-badge';
                badge.innerHTML = '✓';
                ancientGate.appendChild(badge);
            }
        }
        if (completedGates.mystical) {
            mysticalGate.classList.add('completed');
            if (!mysticalGate.querySelector('.completed-badge')) {
                const badge = document.createElement('div');
                badge.className = 'completed-badge';
                badge.innerHTML = '✓';
                mysticalGate.appendChild(badge);
            }
        }
        if (completedGates.space) {
            spaceGate.classList.add('completed');
            if (!spaceGate.querySelector('.completed-badge')) {
                const badge = document.createElement('div');
                badge.className = 'completed-badge';
                badge.innerHTML = '✓';
                spaceGate.appendChild(badge);
            }
        }
        
        const allCompleted = completedGates.ancient && completedGates.mystical && completedGates.space;
        const prizeContainer = document.getElementById('prizeContainer');
        const completionText = document.getElementById('completionText');
        
        if (allCompleted) {
            prizeContainer.classList.add('visible');
            completionText.innerHTML = '✨ ALL GATES COMPLETED! YOUR PRIZE AWAITS! ✨';
        } else {
            const count = Object.values(completedGates).filter(v => v === true).length;
            completionText.innerHTML = `🏆 ${count}/3 GATES COMPLETED • COMPLETE ALL FOR THE ULTIMATE PRIZE 🏆`;
            prizeContainer.classList.add('visible');
        }
    }
    
    // Listen for storage events (when gates are completed in other pages)
    window.addEventListener('storage', (e) => {
        if (e.key === 'completedGates') {
            completedGates = JSON.parse(e.newValue || '{"ancient":false,"mystical":false,"space":false}');
            updateGateCompletionUI();
        }
    });
    
    // 3D Background
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.FogExp2(0x050510, 0.002);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 12);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.3;
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.target.set(0, 0, 0);
    
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.3, 0.3, 0.85);
    bloomPass.strength = 1.0;
    const effectComposer = new EffectComposer(renderer);
    effectComposer.addPass(renderScene);
    effectComposer.addPass(bloomPass);
    
    const coreGeo = new THREE.SphereGeometry(0.8, 128, 128);
    const coreMat = new THREE.MeshStandardMaterial({ color: 0xFF6688, emissive: 0xFF3366, emissiveIntensity: 0.8 });
    const core = new THREE.Mesh(coreGeo, coreMat);
    scene.add(core);
    
    const ring1Geo = new THREE.TorusGeometry(1.1, 0.05, 128, 256);
    const ring1Mat = new THREE.MeshStandardMaterial({ color: 0xFF88AA, emissive: 0xFF4466 });
    const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
    scene.add(ring1);
    
    const ring2Geo = new THREE.TorusGeometry(1.4, 0.06, 128, 256);
    const ring2Mat = new THREE.MeshStandardMaterial({ color: 0xFFAA88, emissive: 0xFF6644 });
    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
    scene.add(ring2);
    
    const ring3Geo = new THREE.TorusGeometry(1.7, 0.07, 128, 256);
    const ring3Mat = new THREE.MeshStandardMaterial({ color: 0xFFCCAA, emissive: 0xFF8866 });
    const ring3 = new THREE.Mesh(ring3Geo, ring3Mat);
    scene.add(ring3);
    
    const particleCount = 4000;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
        const radius = 1.2 + Math.random() * 1.5;
        const angle = Math.random() * Math.PI * 2;
        const y = (Math.random() - 0.5) * 2;
        particlePositions[i * 3] = Math.cos(angle) * radius;
        particlePositions[i * 3 + 1] = y;
        particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0xFF8866, size: 0.02, blending: THREE.AdditiveBlending }));
    scene.add(particles);
    
    const starCount = 4000;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPositions[i * 3] = (Math.random() - 0.5) * 200;
        starPositions[i * 3 + 1] = (Math.random() - 0.5) * 100;
        starPositions[i * 3 + 2] = (Math.random() - 0.5) * 100 - 50;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.5 }));
    scene.add(stars);
    
    const ambientLight = new THREE.AmbientLight(0x111122);
    scene.add(ambientLight);
    const coreLight = new THREE.PointLight(0xFF3366, 1.5, 20);
    coreLight.position.set(0, 0, 0);
    scene.add(coreLight);
    
    let time = 0;
    let frameCount = 0;
    let lastTime = performance.now();
    
    function animate() {
        requestAnimationFrame(animate);
        time += 0.016;
        
        ring1.rotation.z += 0.008;
        ring2.rotation.z -= 0.006;
        ring3.rotation.z += 0.005;
        particles.rotation.y += 0.002;
        stars.rotation.y += 0.0003;
        coreLight.intensity = 1.3 + Math.sin(time * 4) * 0.3;
        const pulse = 0.95 + Math.sin(time * 5) * 0.05;
        core.scale.set(pulse, pulse, pulse);
        controls.update();
        
        frameCount++;
        const now = performance.now();
        if (now - lastTime >= 1000) {
            document.getElementById('fps').innerHTML = `FPS: ${frameCount}`;
            frameCount = 0;
            lastTime = now;
        }
        effectComposer.render();
    }
    animate();
    
    const transitionOverlay = document.getElementById('transitionOverlay');
    let isTransitioning = false;
    
    function zoomToGate(gateType, destinationUrl, flashColor) {
        if (isTransitioning) return;
        isTransitioning = true;
        
        const flash = document.createElement('div');
        flash.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:${flashColor};z-index:10001;opacity:0;transition:opacity 0.2s;pointer-events:none;`;
        document.body.appendChild(flash);
        setTimeout(() => flash.style.opacity = '1', 10);
        setTimeout(() => flash.remove(), 400);
        
        const startTime = performance.now();
        const duration = 2000;
        
        function zoomAnimation(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(1, elapsed / duration);
            const easeOut = 1 - Math.pow(1 - progress, 1.5);
            
            camera.position.z = 12 - easeOut * 10;
            camera.fov = 45 + easeOut * 25;
            camera.updateProjectionMatrix();
            coreLight.intensity = 1.5 + progress * 3;
            bloomPass.strength = 1.0 + progress * 1.5;
            
            if (progress < 1) {
                requestAnimationFrame(zoomAnimation);
            } else {
                transitionOverlay.classList.add('active');
                setTimeout(() => { window.location.href = destinationUrl; }, 500);
            }
        }
        requestAnimationFrame(zoomAnimation);
    }
    
    const title = document.getElementById('title');
    const ancientGate = document.getElementById('ancientGate');
    const mysticalGate = document.getElementById('mysticalGate');
    const spaceGate = document.getElementById('spaceGate');
    
    setTimeout(() => {
        title.classList.add('visible');
        ancientGate.classList.add('visible');
        mysticalGate.classList.add('visible');
        spaceGate.classList.add('visible');
        updateGateCompletionUI();
    }, 500);
    
    ancientGate.addEventListener('click', () => zoomToGate('ancient', 'ancient-riddle.html', '#DAA520'));
    mysticalGate.addEventListener('click', () => zoomToGate('mystical', 'mystical-challenge.html', '#DA70D6'));
    spaceGate.addEventListener('click', () => zoomToGate('space', 'space-puzzle.html', '#00FFFF'));
    
    document.getElementById('backBtn').addEventListener('click', () => { window.location.href = "testing.html"; });
    document.getElementById('prizeBtn').addEventListener('click', () => {
        if (completedGates.ancient && completedGates.mystical && completedGates.space) {
            window.location.href = "prize.html";
        } else {
            alert("You must complete all three gates first!");
        }
    });
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        effectComposer.setSize(window.innerWidth, window.innerHeight);
    });
    
    console.log('%c✨ GATE HUB | Track completed gates | Prize awaits ✨', 'color: #FFD700; font-size: 14px');
</script>
</body>
</html>
