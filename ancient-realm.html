<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ancient Realm | The Riddle of Wisdom</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        
        .ui-panel {
            position: fixed;
            bottom: 30px;
            left: 30px;
            right: 30px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border: 2px solid #DAA520;
            border-radius: 20px;
            padding: 25px;
            z-index: 100;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
            pointer-events: auto;
        }
        .riddle-text { font-size: 1.2rem; color: #DAA520; margin-bottom: 20px; letter-spacing: 1px; }
        .options { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .option-btn { background: rgba(218,165,32,0.2); border: 1px solid #DAA520; padding: 10px 20px; color: #FFD700; cursor: pointer; border-radius: 30px; transition: all 0.3s ease; font-family: monospace; }
        .option-btn:hover { background: #DAA520; color: #000; transform: scale(1.02); }
        .feedback { margin-top: 15px; font-size: 0.8rem; color: #aaa; }
        .success { color: #00ff88; }
        .title { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 100; }
        .title h1 { font-size: 1.5rem; letter-spacing: 8px; background: linear-gradient(135deg, #DAA520, #CD853F); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .back-btn { position: fixed; bottom: 30px; right: 30px; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); border: 1px solid #DAA520; padding: 12px 24px; color: #DAA520; cursor: pointer; z-index: 100; border-radius: 30px; transition: all 0.3s ease; }
        .back-btn:hover { background: rgba(218,165,32,0.2); transform: translateX(-5px); }
        .reset-btn { position: fixed; top: 30px; right: 30px; background: rgba(0,0,0,0.7); border: 1px solid #DAA520; padding: 8px 16px; color: #DAA520; cursor: pointer; z-index: 100; border-radius: 20px; font-size: 0.7rem; }
        @media (max-width: 600px) { .riddle-text { font-size: 0.9rem; } .option-btn { padding: 6px 12px; font-size: 0.7rem; } }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="title"><h1>🏛️ ANCIENT RIDDLE 🏛️</h1></div>
    <div class="ui-panel" id="riddlePanel">
        <div class="riddle-text" id="riddleText">I speak without a mouth and hear without ears. I have no body, but I come alive with wind. What am I?</div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
    </div>
    <button class="reset-btn" id="resetBtn">⟳ RESET</button>
    <button class="back-btn" id="backBtn">← BACK TO HUB</button>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a0e05);
        scene.fog = new THREE.FogExp2(0x1a0e05, 0.008);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 10);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.target.set(0, 1, 0);
        
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.3, 0.85);
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // Ancient environment
        const groundGeo = new THREE.CylinderGeometry(5, 5, 0.3, 32);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.7 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.position.y = -0.5;
        scene.add(ground);
        
        const pillarGeo = new THREE.CylinderGeometry(0.5, 0.6, 2.5, 16);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0xCD853F, metalness: 0.4 });
        const positions = [[1.5, 0.5, 1.5], [-1.5, 0.5, 1.5], [1.5, 0.5, -1.5], [-1.5, 0.5, -1.5]];
        positions.forEach(pos => { const p = new THREE.Mesh(pillarGeo, pillarMat); p.position.set(pos[0], pos[1], pos[2]); scene.add(p); });
        
        const orbGeo = new THREE.SphereGeometry(0.7, 64, 64);
        const orbMat = new THREE.MeshStandardMaterial({ color: 0xDAA520, emissive: 0xDAA520, emissiveIntensity: 0.6 });
        const orb = new THREE.Mesh(orbGeo, orbMat);
        orb.position.y = 1.3;
        scene.add(orb);
        
        const particleCount = 3000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const radius = 2 + Math.random() * 3;
            const angle = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 4;
            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0xDAA520, size: 0.05, blending: THREE.AdditiveBlending }));
        scene.add(particles);
        
        const ambientLight = new THREE.AmbientLight(0x221100);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xDAA520, 1.0);
        mainLight.position.set(2, 5, 3);
        scene.add(mainLight);
        const orbLight = new THREE.PointLight(0xDAA520, 1.0);
        orbLight.position.set(0, 1.3, 0);
        scene.add(orbLight);
        
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            const pulse = 0.9 + Math.sin(time * 3) * 0.1;
            orb.scale.set(pulse, pulse, pulse);
            orbLight.intensity = 0.7 + Math.sin(time * 4) * 0.3;
            particles.rotation.y += 0.001;
            controls.update();
            effectComposer.render();
        }
        animate();
        
        // Riddle System
        const riddles = [
            { text: "I speak without a mouth and hear without ears. I have no body, but I come alive with wind. What am I?", options: ["Shadow", "Echo", "Fire", "Light"], correct: 1 },
            { text: "The more you take, the more you leave behind. What am I?", options: ["Memories", "Footsteps", "Time", "Breath"], correct: 1 },
            { text: "I have keys but no locks. I have space but no room. What am I?", options: ["Piano", "Keyboard", "Map", "Treasure Chest"], correct: 1 },
            { text: "What can travel around the world while staying in a corner?", options: ["Light", "Sound", "A Stamp", "Wind"], correct: 2 }
        ];
        
        let currentRiddle = 0;
        let score = 0;
        
        function loadRiddle() {
            const r = riddles[currentRiddle];
            document.getElementById('riddleText').innerHTML = r.text;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            r.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = opt;
                btn.onclick = () => checkAnswer(idx);
                optionsDiv.appendChild(btn);
            });
            document.getElementById('feedback').innerHTML = `Riddle ${currentRiddle + 1} of ${riddles.length} | Score: ${score}`;
        }
        
        function checkAnswer(selected) {
            const isCorrect = selected === riddles[currentRiddle].correct;
            if (isCorrect) {
                score++;
                document.getElementById('feedback').innerHTML = `<span class="success">✓ CORRECT! +1 point</span><br>Riddle ${currentRiddle + 1} of ${riddles.length} | Score: ${score}`;
                orbLight.intensity = 1.5;
                setTimeout(() => { orbLight.intensity = 0.7; }, 500);
                currentRiddle++;
                if (currentRiddle < riddles.length) {
                    setTimeout(() => loadRiddle(), 1000);
                } else {
                    document.getElementById('feedback').innerHTML = `<span class="success">✨ COMPLETED! You have mastered the Ancient Riddles! Score: ${score}/${riddles.length} ✨</span>`;
                    document.getElementById('options').innerHTML = '';
                    document.getElementById('riddleText').innerHTML = "🏆 YOU HAVE PASSED THE TRIAL OF WISDOM! 🏆";
                }
            } else {
                document.getElementById('feedback').innerHTML = `<span style="color:#FF6666">✗ INCORRECT! Try again.</span><br>Riddle ${currentRiddle + 1} of ${riddles.length} | Score: ${score}`;
            }
        }
        
        document.getElementById('resetBtn').addEventListener('click', () => { currentRiddle = 0; score = 0; loadRiddle(); });
        document.getElementById('backBtn').addEventListener('click', () => { window.location.href = "gate-hub.html"; });
        
        loadRiddle();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
