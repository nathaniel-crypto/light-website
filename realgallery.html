<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>UNSEEN WORLD | 4D Photorealistic Gallery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000000; font-family: 'Space Grotesk', sans-serif; color: #ffffff; overflow: hidden; height: 100vh; width: 100vw; }
        ::-webkit-scrollbar { display: none; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        canvas { display: block; width: 100% !important; height: 100% !important; }

        /* Premium UI Overlay */
        .ui-overlay { position: fixed; bottom: 30px; left: 30px; z-index: 100; display: flex; gap: 15px; flex-wrap: wrap; }
        .btn { 
            background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,215,0,0.4); 
            padding: 14px 28px; 
            color: #FFD700; 
            letter-spacing: 4px; 
            font-size: 0.75rem; 
            font-weight: 600; 
            clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%); 
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1); 
            cursor: pointer; 
            font-family: 'Space Grotesk', sans-serif; 
            text-transform: uppercase;
        }
        .btn:hover { 
            letter-spacing: 6px; 
            background: rgba(255,215,0,0.15); 
            border-color: #FFD700; 
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .btn-pulsar { background: linear-gradient(135deg, rgba(255,51,102,0.8), rgba(255,20,147,0.8)); border-color: #FFD700; color: white; backdrop-filter: blur(20px); }
        .btn-pulsar:hover { background: linear-gradient(135deg, rgba(255,20,147,0.9), rgba(255,51,102,0.9)); letter-spacing: 6px; }
        .btn-dark { background: linear-gradient(135deg, rgba(26,0,51,0.8), rgba(51,0,102,0.8)); border-color: #FF3366; color: #FF6699; }
        .btn-dark:hover { background: linear-gradient(135deg, rgba(51,0,102,0.9), rgba(26,0,51,0.9)); border-color: #FF6699; }
        .btn-light { background: linear-gradient(135deg, rgba(255,215,0,0.8), rgba(255,170,0,0.8)); border-color: #FFFF00; color: #1a1a2e; }
        .btn-light:hover { background: linear-gradient(135deg, rgba(255,170,0,0.9), rgba(255,215,0,0.9)); letter-spacing: 6px; }
        
        .title { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 100; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
        .title h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 10px; background: linear-gradient(135deg, #FFD700, #FF1493, #00FFFF); background-clip: text; -webkit-background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .title p { font-size: 0.65rem; letter-spacing: 5px; color: rgba(255,255,255,0.6); margin-top: 0.8rem; }
        .title.visible { opacity: 1; }
        
        .fps-counter { position: fixed; top: 20px; right: 20px; color: #00ff88; font-family: monospace; font-size: 11px; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 8px; z-index: 100; letter-spacing: 1px; }
        .transition-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
        .transition-overlay.active { opacity: 1; pointer-events: all; }
        
        @media (max-width: 768px) {
            .btn { padding: 8px 16px; font-size: 0.6rem; letter-spacing: 2px; }
            .title h1 { font-size: 1rem; letter-spacing: 5px; }
            .ui-overlay { gap: 8px; bottom: 15px; left: 15px; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="title" id="title">
    <h1>UNSEEN WORLD</h1>
    <p>4D PHOTOREALISTIC GALLERY</p>
</div>

<div class="ui-overlay">
    <button class="btn" id="backBtn">← BACK</button>
    <button class="btn btn-pulsar" id="pulsarBtn">🌀 PULSAR GATE 🌀</button>
    <button class="btn btn-dark" id="darkGateBtn">🌑 DARK GATE 🌑</button>
    <button class="btn btn-light" id="lightGateBtn">✨ LIGHT GATE ✨</button>
</div>

<div class="transition-overlay" id="transitionOverlay"></div>
<div class="fps-counter" id="fps">FPS: --</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
    
    // ============================================
    // 4D PHOTOREALISTIC SETUP
    // ============================================
    
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030318);
    scene.fog = new THREE.FogExp2(0x030318, 0.0025);
    
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 1.8, 14);
    camera.lookAt(0, 0, 0);
    
    const renderer = new THREE.WebGLRenderer({ 
        antialias: true, 
        powerPreference: "high-performance",
        alpha: false,
        stencil: false,
        depth: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);
    
    // Cinematic Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.enableZoom = true;
    controls.zoomSpeed = 0.8;
    controls.enablePan = false;
    controls.target.set(0, 0, 0);
    
    // Premium Post-Processing Stack
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.35, 0.9);
    bloomPass.threshold = 0.04;
    bloomPass.strength = 1.1;
    bloomPass.radius = 0.78;
    const afterimagePass = new AfterimagePass(0.96);
    afterimagePass.renderToScreen = false;
    const effectComposer = new EffectComposer(renderer);
    effectComposer.addPass(renderScene);
    effectComposer.addPass(bloomPass);
    effectComposer.addPass(afterimagePass);
    afterimagePass.renderToScreen = true;
    
    // ============================================
    // 4D PHOTOREALISTIC PORTAL (High Detail)
    // ============================================
    
    const portalGroup = new THREE.Group();
    scene.add(portalGroup);
    
    // High-res event horizon with realistic Fresnel effect
    const coreGeo = new THREE.SphereGeometry(1.25, 512, 512);
    const coreMat = new THREE.MeshStandardMaterial({
        color: 0xFF4488,
        emissive: 0xFF2266,
        emissiveIntensity: 0.7,
        metalness: 0.92,
        roughness: 0.12,
        emissiveMap: null
    });
    const coreSphere = new THREE.Mesh(coreGeo, coreMat);
    coreSphere.castShadow = true;
    portalGroup.add(coreSphere);
    
    // Inner glow sphere (volumetric)
    const innerGlowGeo = new THREE.SphereGeometry(1.38, 512, 512);
    const innerGlowMat = new THREE.MeshBasicMaterial({
        color: 0xFF66AA,
        transparent: true,
        opacity: 0.18,
        side: THREE.BackSide
    });
    const innerGlow = new THREE.Mesh(innerGlowGeo, innerGlowMat);
    portalGroup.add(innerGlow);
    
    // Outer glow ring
    const outerGlowGeo = new THREE.SphereGeometry(1.55, 512, 512);
    const outerGlowMat = new THREE.MeshBasicMaterial({
        color: 0xFF88CC,
        transparent: true,
        opacity: 0.08,
        side: THREE.BackSide
    });
    const outerGlow = new THREE.Mesh(outerGlowGeo, outerGlowMat);
    portalGroup.add(outerGlow);
    
    // Realistic accretion disk - 4 layers for depth
    const disk1Geo = new THREE.TorusGeometry(2.2, 0.22, 512, 1024);
    const disk1Mat = new THREE.MeshStandardMaterial({
        color: 0xFF4488,
        emissive: 0xFF2266,
        emissiveIntensity: 0.85,
        metalness: 0.94,
        roughness: 0.18,
        transparent: true,
        opacity: 0.94
    });
    const disk1 = new THREE.Mesh(disk1Geo, disk1Mat);
    disk1.rotation.x = Math.PI / 2.16;
    disk1.rotation.z = 0.32;
    portalGroup.add(disk1);
    
    const disk2Geo = new THREE.TorusGeometry(2.9, 0.19, 512, 1024);
    const disk2Mat = new THREE.MeshStandardMaterial({
        color: 0xFF6655,
        emissive: 0xFF4433,
        emissiveIntensity: 0.7,
        metalness: 0.9,
        roughness: 0.24,
        transparent: true,
        opacity: 0.88
    });
    const disk2 = new THREE.Mesh(disk2Geo, disk2Mat);
    disk2.rotation.x = Math.PI / 2.1;
    disk2.rotation.z = -0.25;
    portalGroup.add(disk2);
    
    const disk3Geo = new THREE.TorusGeometry(3.6, 0.17, 512, 1024);
    const disk3Mat = new THREE.MeshStandardMaterial({
        color: 0xFF8866,
        emissive: 0xFF6644,
        emissiveIntensity: 0.58,
        metalness: 0.86,
        roughness: 0.3,
        transparent: true,
        opacity: 0.82
    });
    const disk3 = new THREE.Mesh(disk3Geo, disk3Mat);
    disk3.rotation.x = Math.PI / 2.04;
    disk3.rotation.z = 0.18;
    portalGroup.add(disk3);
    
    const hotRingGeo = new THREE.TorusGeometry(1.68, 0.09, 512, 1024);
    const hotRingMat = new THREE.MeshStandardMaterial({
        color: 0xFFAA88,
        emissive: 0xFF6644,
        emissiveIntensity: 1.2,
        metalness: 0.96,
        roughness: 0.1
    });
    const hotRing = new THREE.Mesh(hotRingGeo, hotRingMat);
    hotRing.rotation.x = Math.PI / 2.22;
    portalGroup.add(hotRing);
    
    // Gravitational lensing ring
    const lensGeo = new THREE.TorusGeometry(2.5, 0.055, 512, 1024);
    const lensMat = new THREE.MeshStandardMaterial({
        color: 0xFFCCAA,
        emissive: 0xFF8866,
        emissiveIntensity: 0.65,
        transparent: true,
        opacity: 0.7
    });
    const lensRing = new THREE.Mesh(lensGeo, lensMat);
    lensRing.rotation.x = Math.PI / 2;
    portalGroup.add(lensRing);
    
    // ============================================
    // HIGH DENSITY PARTICLE SYSTEM (100,000 particles)
    // ============================================
    
    const particleCount = 100000;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    const particleColors = new Float32Array(particleCount * 3);
    
    for (let i = 0; i < particleCount; i++) {
        const radius = 1.5 + Math.random() * 5;
        const angle = Math.random() * Math.PI * 2;
        const yOffset = (Math.random() - 0.5) * 1.5;
        particlePositions[i * 3] = Math.cos(angle) * radius;
        particlePositions[i * 3 + 1] = yOffset;
        particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
        
        const colorChoice = Math.random();
        if (colorChoice < 0.4) {
            particleColors[i * 3] = 1.0;
            particleColors[i * 3 + 1] = 0.55 + Math.random() * 0.4;
            particleColors[i * 3 + 2] = 0.35 + Math.random() * 0.4;
        } else if (colorChoice < 0.7) {
            particleColors[i * 3] = 1.0;
            particleColors[i * 3 + 1] = 0.35 + Math.random() * 0.35;
            particleColors[i * 3 + 2] = 0.5 + Math.random() * 0.4;
        } else {
            particleColors[i * 3] = 0.85;
            particleColors[i * 3 + 1] = 0.25 + Math.random() * 0.35;
            particleColors[i * 3 + 2] = 1.0;
        }
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
    
    const particleMat = new THREE.PointsMaterial({
        size: 0.038,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    portalGroup.add(particles);
    
    // ============================================
    // CINEMATIC STARFIELD (20,000 stars)
    // ============================================
    
    const starCount = 20000;
    const starGeo = new THREE.BufferGeometry();
    const starPositionsArr = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPositionsArr[i * 3] = (Math.random() - 0.5) * 300;
        starPositionsArr[i * 3 + 1] = (Math.random() - 0.5) * 180;
        starPositionsArr[i * 3 + 2] = (Math.random() - 0.5) * 150 - 80;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositionsArr, 3));
    const starMatStars = new THREE.PointsMaterial({ color: 0xffffff, size: 0.055, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
    const stars = new THREE.Points(starGeo, starMatStars);
    scene.add(stars);
    
    // ============================================
    // VOLUMETRIC LIGHTING (8 Light Sources)
    // ============================================
    
    const ambientLight = new THREE.AmbientLight(0x111122);
    scene.add(ambientLight);
    
    const coreLight = new THREE.PointLight(0xFF3366, 2.2, 25);
    coreLight.position.set(0, 0, 0);
    coreLight.castShadow = true;
    coreLight.shadow.mapSize.width = 1024;
    coreLight.shadow.mapSize.height = 1024;
    scene.add(coreLight);
    
    const fillLight1 = new THREE.PointLight(0xFF8866, 0.8, 30);
    fillLight1.position.set(2.8, 2.2, 4);
    scene.add(fillLight1);
    
    const fillLight2 = new THREE.PointLight(0xAA44FF, 0.65, 30);
    fillLight2.position.set(-2.5, -1.5, 5);
    scene.add(fillLight2);
    
    const fillLight3 = new THREE.PointLight(0x44AAFF, 0.55, 32);
    fillLight3.position.set(1.8, -1, 6);
    scene.add(fillLight3);
    
    const rimLight = new THREE.DirectionalLight(0xFFAA77, 0.85);
    rimLight.position.set(1.3, 2, -4.5);
    scene.add(rimLight);
    
    const backRim = new THREE.DirectionalLight(0xFF77AA, 0.7);
    backRim.position.set(-1.2, 0.8, -5.5);
    scene.add(backRim);
    
    // ============================================
    // FLOATING ORBS (Atmospheric depth)
    // ============================================
    
    const orbCount = 24;
    const orbs = [];
    for (let i = 0; i < orbCount; i++) {
        const orbGeo = new THREE.SphereGeometry(0.08, 32, 32);
        const orbMat = new THREE.MeshStandardMaterial({ color: 0xFF6699, emissive: 0xFF3366, emissiveIntensity: 0.5 });
        const orb = new THREE.Mesh(orbGeo, orbMat);
        orb.userData = {
            radius: 2.5 + Math.random() * 2,
            speed: 0.3 + Math.random() * 0.3,
            angle: Math.random() * Math.PI * 2,
            yOffset: (Math.random() - 0.5) * 2
        };
        orb.position.x = Math.cos(orb.userData.angle) * orb.userData.radius;
        orb.position.z = Math.sin(orb.userData.angle) * orb.userData.radius;
        orb.position.y = orb.userData.yOffset;
        scene.add(orb);
        orbs.push(orb);
    }
    
    // ============================================
    // ANIMATION LOOP
    // ============================================
    
    let time = 0;
    let frameCount = 0;
    let lastTime = performance.now();
    let isTransitioning = false;
    
    function animate() {
        requestAnimationFrame(animate);
        time += 0.016;
        
        if (!isTransitioning) {
            // Rotate accretion disks
            disk1.rotation.z += 0.012;
            disk2.rotation.z -= 0.01;
            disk3.rotation.z += 0.008;
            hotRing.rotation.z += 0.014;
            lensRing.rotation.z += 0.006;
            
            // Rotate particles
            particles.rotation.y += 0.0025;
            stars.rotation.y += 0.0005;
            
            // Animate orbs
            orbs.forEach(orb => {
                orb.userData.angle += 0.008 * orb.userData.speed;
                orb.position.x = Math.cos(orb.userData.angle) * orb.userData.radius;
                orb.position.z = Math.sin(orb.userData.angle) * orb.userData.radius;
                orb.position.y = orb.userData.yOffset + Math.sin(time * 1.5) * 0.2;
            });
            
            // Pulsing effects
            const pulse = 1.8 + Math.sin(time * 5) * 0.4;
            coreLight.intensity = pulse;
            innerGlow.material.opacity = 0.16 + Math.sin(time * 4) * 0.05;
            hotRing.material.emissiveIntensity = 1.1 + Math.sin(time * 6) * 0.3;
        }
        
        controls.update();
        
        // FPS counter
        frameCount++;
        const now = performance.now();
        if (now - lastTime >= 1000) {
            document.getElementById('fps').innerHTML = `FPS: ${frameCount}`;
            const fpsElement = document.getElementById('fps');
            if (frameCount >= 90) fpsElement.style.color = '#00ff88';
            else if (frameCount >= 60) fpsElement.style.color = '#ffaa00';
            else if (frameCount >= 30) fpsElement.style.color = '#ff6600';
            else fpsElement.style.color = '#ff3366';
            frameCount = 0;
            lastTime = now;
        }
        
        effectComposer.render();
    }
    
    animate();
    
    // ============================================
    // GATE TRANSITIONS (Maintained from original)
    // ============================================
    
    const transitionOverlay = document.getElementById('transitionOverlay');
    
    function startPulsarTransition() {
        if (isTransitioning) return;
        isTransitioning = true;
        
        const flash = document.createElement('div');
        flash.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:10001;opacity:0;transition:opacity 0.2s;pointer-events:none;`;
        document.body.appendChild(flash);
        setTimeout(() => flash.style.opacity = '1', 10);
        setTimeout(() => flash.remove(), 400);
        
        const startTime = performance.now();
        const duration = 2000;
        
        function zoomAnimation(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(1, elapsed / duration);
            const easeOut = 1 - Math.pow(1 - progress, 1.5);
            
            camera.position.z = 14 - easeOut * 12;
            camera.fov = 50 + easeOut * 25;
            camera.updateProjectionMatrix();
            coreLight.intensity = 2.2 + progress * 3;
            bloomPass.strength = 1.1 + progress * 1.5;
            
            if (progress < 1) {
                requestAnimationFrame(zoomAnimation);
            } else {
                transitionOverlay.classList.add('active');
                setTimeout(() => { window.location.href = "gate-hub.html"; }, 500);
            }
        }
        
        requestAnimationFrame(zoomAnimation);
    }
    
    function startDarkTransition() {
        if (isTransitioning) return;
        isTransitioning = true;
        
        const flash = document.createElement('div');
        flash.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:#FF3366;z-index:10001;opacity:0;transition:opacity 0.2s;pointer-events:none;`;
        document.body.appendChild(flash);
        setTimeout(() => flash.style.opacity = '1', 10);
        setTimeout(() => flash.remove(), 400);
        
        const startTime = performance.now();
        const duration = 2000;
        
        function zoomAnimation(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(1, elapsed / duration);
            const easeOut = 1 - Math.pow(1 - progress, 1.5);
            
            camera.position.z = 14 - easeOut * 12;
            camera.fov = 50 + easeOut * 25;
            camera.updateProjectionMatrix();
            coreLight.intensity = 2.2 + progress * 3;
            bloomPass.strength = 1.1 + progress * 1.5;
            
            if (progress < 1) {
                requestAnimationFrame(zoomAnimation);
            } else {
                transitionOverlay.classList.add('active');
                setTimeout(() => { window.location.href = "gate-hub.html"; }, 500);
            }
        }
        
        requestAnimationFrame(zoomAnimation);
    }
    
    function startLightTransition() {
        if (isTransitioning) return;
        isTransitioning = true;
        
        const flash = document.createElement('div');
        flash.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:#FFD700;z-index:10001;opacity:0;transition:opacity 0.2s;pointer-events:none;`;
        document.body.appendChild(flash);
        setTimeout(() => flash.style.opacity = '1', 10);
        setTimeout(() => flash.remove(), 400);
        
        const startTime = performance.now();
        const duration = 2000;
        
        function zoomAnimation(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(1, elapsed / duration);
            const easeOut = 1 - Math.pow(1 - progress, 1.5);
            
            camera.position.z = 14 - easeOut * 12;
            camera.fov = 50 + easeOut * 25;
            camera.updateProjectionMatrix();
            coreLight.intensity = 2.2 + progress * 3;
            bloomPass.strength = 1.1 + progress * 1.5;
            
            if (progress < 1) {
                requestAnimationFrame(zoomAnimation);
            } else {
                transitionOverlay.classList.add('active');
                setTimeout(() => { window.location.href = "gate-hub.html"; }, 500);
            }
        }
        
        requestAnimationFrame(zoomAnimation);
    }
    
    // UI Event Listeners
    const title = document.getElementById('title');
    setTimeout(() => {
        title.classList.add('visible');
    }, 500);
    
    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = "index.html";
    });
    document.getElementById('pulsarBtn').addEventListener('click', startPulsarTransition);
    document.getElementById('darkGateBtn').addEventListener('click', startDarkTransition);
    document.getElementById('lightGateBtn').addEventListener('click', startLightTransition);
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        effectComposer.setSize(window.innerWidth, window.innerHeight);
    });
    
    console.log('%c✨ UNSEEN WORLD | 4D PHOTOREALISTIC GALLERY ACTIVATED ✨', 'color: #FFD700; font-size: 14px');
    console.log('%c🌀 100,000 Particles | 20,000 Stars | 8 Light Sources | Realistic Accretion Disk', 'color: #FF1493; font-size: 12px');
    console.log('%c⚡ Click any gate to begin your journey', 'color: #00FFFF; font-size: 12px');
</script>
</body>
</html>
