<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>UNSEEN WORLD | 3D ORBIT GALLERY</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000000; font-family: 'Space Grotesk', sans-serif; color: #ffffff; overflow: hidden; height: 100vh; width: 100vw; }
        ::-webkit-scrollbar { display: none; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        canvas { display: block; width: 100% !important; height: 100% !important; }

        .ui-overlay { position: fixed; bottom: 30px; left: 30px; z-index: 100; display: flex; gap: 15px; }
        .btn { background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,215,0,0.5); padding: 12px 24px; color: #FFD700; text-decoration: none; letter-spacing: 3px; font-size: 0.7rem; font-weight: 500; clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%); transition: all 0.3s ease; cursor: pointer; font-family: 'Space Grotesk', sans-serif; }
        .btn:hover { letter-spacing: 5px; background: rgba(255,215,0,0.2); border-color: #FFD700; transform: translateX(5px); }
        .btn-primary { background: linear-gradient(135deg, #FF3366, #FF1493); border-color: #FFD700; color: white; }
        .btn-primary:hover { background: linear-gradient(135deg, #FF1493, #FF3366); letter-spacing: 5px; }
        .title { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 100; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
        .title h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: 8px; background: linear-gradient(135deg, #FFD700, #FF1493); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .title p { font-size: 0.6rem; letter-spacing: 4px; color: rgba(255,255,255,0.5); }
        .title.visible { opacity: 1; }
        .fps-counter { position: fixed; top: 20px; right: 20px; color: #00ff88; font-family: monospace; font-size: 11px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px; z-index: 100; }
        .transition-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        .transition-overlay.active { opacity: 1; pointer-events: all; }
        @media (max-width: 768px) { .btn { padding: 8px 16px; font-size: 0.6rem; letter-spacing: 2px; } .title h1 { font-size: 1rem; letter-spacing: 4px; } }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="title" id="title">
    <h1>UNSEEN WORLD</h1>
    <p>LIGHT CAPTURED IN ORBIT</p>
</div>

<div class="ui-overlay">
    <button class="btn" id="backBtn">← BACK TO PORTAL</button>
    <button class="btn btn-primary" id="pulsarBtn">🌀 ACTIVATE PULSAR GATE 🌀</button>
</div>

<div class="transition-overlay" id="transitionOverlay"></div>
<div class="fps-counter" id="fps">FPS: --</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    
    // ============================================
    // 3D ORBIT GALLERY SETUP
    // ============================================
    
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.FogExp2(0x050510, 0.003);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 14);
    camera.lookAt(0, 0, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.5;
    container.appendChild(renderer.domElement);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.target.set(0, 0, 0);
    
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.3, 0.85);
    bloomPass.threshold = 0.05;
    bloomPass.strength = 0.9;
    bloomPass.radius = 0.7;
    const effectComposer = new EffectComposer(renderer);
    effectComposer.addPass(renderScene);
    effectComposer.addPass(bloomPass);
    
    // ============================================
    // CENTRAL PORTAL
    // ============================================
    
    const portalGroup = new THREE.Group();
    scene.add(portalGroup);
    
    const coreGeo = new THREE.SphereGeometry(1.2, 128, 128);
    const coreMat = new THREE.MeshStandardMaterial({ color: 0xFF6688, emissive: 0xFF3366, emissiveIntensity: 0.8, metalness: 0.85, roughness: 0.15, transparent: true, opacity: 0.95 });
    const coreSphere = new THREE.Mesh(coreGeo, coreMat);
    portalGroup.add(coreSphere);
    
    const innerRingGeo = new THREE.TorusGeometry(1.35, 0.06, 128, 256);
    const innerRingMat = new THREE.MeshStandardMaterial({ color: 0xFF88AA, emissive: 0xFF4466, emissiveIntensity: 0.9, metalness: 0.92, roughness: 0.12 });
    const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
    portalGroup.add(innerRing);
    
    const midRingGeo = new THREE.TorusGeometry(1.6, 0.08, 128, 256);
    const midRingMat = new THREE.MeshStandardMaterial({ color: 0xFFAA88, emissive: 0xFF6644, emissiveIntensity: 0.7, metalness: 0.88, roughness: 0.18 });
    const midRing = new THREE.Mesh(midRingGeo, midRingMat);
    portalGroup.add(midRing);
    
    const outerRingGeo = new THREE.TorusGeometry(1.9, 0.1, 128, 256);
    const outerRingMat = new THREE.MeshStandardMaterial({ color: 0xFFCCAA, emissive: 0xFF8866, emissiveIntensity: 0.6, metalness: 0.85, roughness: 0.22 });
    const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
    portalGroup.add(outerRing);
    
    const portalParticleCount = 3000;
    const portalParticleGeo = new THREE.BufferGeometry();
    const portalParticlePositions = new Float32Array(portalParticleCount * 3);
    for (let i = 0; i < portalParticleCount; i++) {
        const radius = 1.4 + Math.random() * 0.8;
        const angle = Math.random() * Math.PI * 2;
        const y = (Math.random() - 0.5) * 1.5;
        portalParticlePositions[i * 3] = Math.cos(angle) * radius;
        portalParticlePositions[i * 3 + 1] = y;
        portalParticlePositions[i * 3 + 2] = Math.sin(angle) * radius;
    }
    portalParticleGeo.setAttribute('position', new THREE.BufferAttribute(portalParticlePositions, 3));
    const portalParticles = new THREE.Points(portalParticleGeo, new THREE.PointsMaterial({ color: 0xFF8866, size: 0.03, blending: THREE.AdditiveBlending }));
    portalGroup.add(portalParticles);
    
    // ============================================
    // 12 POLAROIDS IN ORBIT
    // ============================================
    
    const polaroidNames = ["Golden Hour", "Studio Light", "Bioluminescence", "Light Painting", "Macro Sunlight", "Northern Lights", "Candlelight", "Neon Nights", "Underwater", "Prism", "Starlight", "Digital LED"];
    const polaroidColors = [0xFFD700, 0xFFFFFF, 0x00FFCC, 0xFF1493, 0x7FFF00, 0x00FF88, 0xFF6600, 0xFF00FF, 0x0099FF, 0xFFFF00, 0xFFD700, 0x00FFFF];
    const polaroids = [];
    
    for (let i = 0; i < 12; i++) {
        const group = new THREE.Group();
        const planeGeo = new THREE.PlaneGeometry(1.1, 1.4);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, roughness: 0.3 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        group.add(plane);
        
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grad.addColorStop(0, `hsl(${i * 30}, 100%, 60%)`);
        grad.addColorStop(1, `hsl(${i * 30 + 40}, 100%, 50%)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.font = 'Bold 50px "Space Grotesk"';
        ctx.textAlign = 'center';
        ctx.fillText(polaroidNames[i].charAt(0), 256, 280);
        
        const texture = new THREE.CanvasTexture(canvas);
        const imageMat = new THREE.MeshStandardMaterial({ map: texture, side: THREE.DoubleSide, roughness: 0.2 });
        const imagePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.95), imageMat);
        imagePlane.position.z = 0.02;
        group.add(imagePlane);
        
        const radius = 2.8 + Math.random() * 2.5;
        const angle = (i / 12) * Math.PI * 2;
        const yOffset = Math.sin(angle * 2) * 0.6;
        group.position.x = Math.cos(angle) * radius;
        group.position.y = yOffset;
        group.position.z = Math.sin(angle) * radius;
        group.lookAt(0, 0, 0);
        scene.add(group);
        
        polaroids.push({ group, radius, speed: 0.4 + Math.random() * 0.3, angle, yAmplitude: 0.6, yOffset });
    }
    
    // Starfield
    const starCount = 5000;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPositions[i * 3] = (Math.random() - 0.5) * 200;
        starPositions[i * 3 + 1] = (Math.random() - 0.5) * 100;
        starPositions[i * 3 + 2] = (Math.random() - 0.5) * 100 - 50;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.5 }));
    scene.add(stars);
    
    // Lighting
    const ambientLight = new THREE.AmbientLight(0x111122);
    scene.add(ambientLight);
    const portalLight = new THREE.PointLight(0xFF6688, 1.8, 20);
    portalLight.position.set(0, 0, 0);
    scene.add(portalLight);
    
    // ============================================
    // 7-SECOND PULSAR TRANSITION
    // ============================================
    
    let isTransitioning = false;
    let transitionProgress = 0;
    const transitionOverlay = document.getElementById('transitionOverlay');
    
    function startPulsarTransition() {
        if (isTransitioning) return;
        isTransitioning = true;
        
        // Flash white
        const flash = document.createElement('div');
        flash.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:10001;opacity:0;transition:opacity 0.2s;pointer-events:none;`;
        document.body.appendChild(flash);
        setTimeout(() => flash.style.opacity = '1', 10);
        setTimeout(() => flash.remove(), 400);
        
        // Store original values for smooth transition
        const startTime = performance.now();
        const duration = 7000; // 7 seconds
        
        function animateTransition(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(1, elapsed / duration);
            
            // Pulsar effect values
            const scaleDown = 1 - progress;
            const spinSpeed = 0.02 + progress * 0.15;
            const intensity = 0.8 + progress * 2.5;
            const bloomStrength = 0.9 + progress * 1.5;
            
            // Scale down and move polaroids to center
            polaroids.forEach((p, idx) => {
                const delayFactor = Math.max(0, Math.min(1, (progress - idx * 0.03) / (1 - idx * 0.03)));
                if (delayFactor > 0) {
                    const s = 1 - delayFactor;
                    p.group.scale.set(s, s, s);
                    // Move toward center
                    p.group.position.x *= (1 - delayFactor);
                    p.group.position.z *= (1 - delayFactor);
                    p.group.position.y *= (1 - delayFactor);
                } else {
                    p.group.scale.set(1, 1, 1);
                }
            });
            
            // Increase portal intensity
            portalLight.intensity = intensity;
            coreSphere.material.emissiveIntensity = intensity * 0.8;
            bloomPass.strength = bloomStrength;
            
            // Speed up rotation
            controls.autoRotateSpeed = 0.8 + progress * 3;
            
            // Make portal pulse faster
            const fastPulse = 1 + Math.sin(elapsed * 0.02) * 0.3;
            innerRing.scale.set(fastPulse, fastPulse, fastPulse);
            midRing.scale.set(fastPulse, fastPulse, fastPulse);
            outerRing.scale.set(fastPulse, fastPulse, fastPulse);
            
            if (progress < 1) {
                requestAnimationFrame(animateTransition);
            } else {
                // Transition complete - redirect to testing area
                transitionOverlay.classList.add('active');
                setTimeout(() => {
                    window.location.href = "testing.html";
                }, 500);
            }
        }
        
        requestAnimationFrame(animateTransition);
    }
    
    // ============================================
    // ANIMATION & UI
    // ============================================
    
    let time = 0;
    let frameCount = 0;
    let lastTime = performance.now();
    
    function animate() {
        requestAnimationFrame(animate);
        time += 0.016;
        
        // Only animate orbits if not transitioning
        if (!isTransitioning) {
            polaroids.forEach(p => {
                p.angle += 0.005 * p.speed;
                p.group.position.x = Math.cos(p.angle) * p.radius;
                p.group.position.z = Math.sin(p.angle) * p.radius;
                p.group.position.y = Math.sin(p.angle * 2) * p.yAmplitude;
                p.group.lookAt(0, 0, 0);
            });
        }
        
        // Rotate portal rings (always)
        innerRing.rotation.z += 0.01;
        midRing.rotation.z -= 0.008;
        outerRing.rotation.z += 0.006;
        portalParticles.rotation.y += 0.005;
        stars.rotation.y += 0.0005;
        
        // Normal portal pulse
        if (!isTransitioning) {
            portalLight.intensity = 1.5 + Math.sin(time * 5) * 0.4;
            coreSphere.material.emissiveIntensity = 0.7 + Math.sin(time * 4) * 0.2;
        }
        
        controls.update();
        
        // FPS counter
        frameCount++;
        const now = performance.now();
        if (now - lastTime >= 1000) {
            document.getElementById('fps').innerHTML = `FPS: ${frameCount}`;
            frameCount = 0;
            lastTime = now;
        }
        
        effectComposer.render();
    }
    animate();
    
    // UI Events
    document.getElementById('title').classList.add('visible');
    document.getElementById('backBtn').addEventListener('click', () => { 
        window.location.href = "index.html"; 
    });
    document.getElementById('pulsarBtn').addEventListener('click', startPulsarTransition);
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        effectComposer.setSize(window.innerWidth, window.innerHeight);
    });
    
    console.log('%c✨ UNSEEN WORLD | 3D ORBIT GALLERY | 7-SECOND PULSAR TRANSITION ✨', 'color: #FFD700; font-size: 14px');
    console.log('%c🌀 Click "ACTIVATE PULSAR GATE" for 7-second transition to Testing Area', 'color: #FF1493; font-size: 12px');
</script>
</body>
</html>
