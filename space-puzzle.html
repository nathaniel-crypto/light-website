<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Space Realm | The Puzzle of Cosmos</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        
        .ui-panel {
            position: fixed;
            bottom: 30px;
            left: 30px;
            right: 30px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border: 2px solid #00FFFF;
            border-radius: 20px;
            padding: 25px;
            z-index: 100;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
            pointer-events: auto;
        }
        .puzzle-text { font-size: 1.2rem; color: #00FFFF; margin-bottom: 20px; }
        .sequence-display { font-size: 2rem; letter-spacing: 10px; margin: 15px 0; color: #00FFFF; font-family: monospace; }
        .options { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .option-btn { background: rgba(0,255,255,0.2); border: 1px solid #00FFFF; padding: 12px 20px; color: #00FFFF; cursor: pointer; border-radius: 30px; transition: all 0.3s ease; font-size: 1.2rem; }
        .option-btn:hover { background: #00FFFF; color: #000; transform: scale(1.05); }
        .feedback { margin-top: 15px; font-size: 0.8rem; color: #aaa; }
        .success { color: #00ff88; }
        .title { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 100; }
        .title h1 { font-size: 1.5rem; letter-spacing: 8px; background: linear-gradient(135deg, #00FFFF, #0066FF); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .back-btn { position: fixed; bottom: 30px; right: 30px; background: rgba(0,0,0,0.7); border: 1px solid #00FFFF; padding: 12px 24px; color: #00FFFF; cursor: pointer; z-index: 100; border-radius: 30px; }
        .back-btn:hover { background: rgba(0,255,255,0.2); }
        .reset-btn { position: fixed; top: 30px; right: 30px; background: rgba(0,0,0,0.7); border: 1px solid #00FFFF; padding: 8px 16px; color: #00FFFF; cursor: pointer; z-index: 100; border-radius: 20px; font-size: 0.7rem; }
        @media (max-width: 600px) { .puzzle-text { font-size: 0.9rem; } .option-btn { padding: 8px 12px; font-size: 1rem; } .sequence-display { font-size: 1.2rem; letter-spacing: 5px; } }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="title"><h1>🌌 SPACE PUZZLE 🌌</h1></div>
    <div class="ui-panel" id="puzzlePanel">
        <div class="puzzle-text" id="puzzleText">Match the cosmic sequence!</div>
        <div class="sequence-display" id="sequenceDisplay">---</div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback">Score: 0/5</div>
    </div>
    <button class="reset-btn" id="resetBtn">⟳ RESET</button>
    <button class="back-btn" id="backBtn">← BACK TO HUB</button>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010118);
        scene.fog = new THREE.FogExp2(0x010118, 0.005);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 12);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.target.set(0, 0, 0);
        
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.3, 0.9);
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // Space environment
        const starCoreGeo = new THREE.SphereGeometry(0.8, 128, 128);
        const starCoreMat = new THREE.MeshStandardMaterial({ color: 0x00FFFF, emissive: 0x00FFFF, emissiveIntensity: 0.8 });
        const starCore = new THREE.Mesh(starCoreGeo, starCoreMat);
        scene.add(starCore);
        
        const ring1Geo = new THREE.TorusGeometry(1.4, 0.05, 128, 256);
        const ring1Mat = new THREE.MeshStandardMaterial({ color: 0x00FFFF, emissive: 0x00FFFF });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        scene.add(ring1);
        
        const ring2Geo = new THREE.TorusGeometry(1.9, 0.06, 128, 256);
        const ring2Mat = new THREE.MeshStandardMaterial({ color: 0x33CCFF, emissive: 0x33CCFF });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        scene.add(ring2);
        
        const ring3Geo = new THREE.TorusGeometry(2.4, 0.07, 128, 256);
        const ring3Mat = new THREE.MeshStandardMaterial({ color: 0x66AAFF, emissive: 0x66AAFF });
        const ring3 = new THREE.Mesh(ring3Geo, ring3Mat);
        scene.add(ring3);
        
        const planetCount = 12;
        const planets = [];
        for (let i = 0; i < planetCount; i++) {
            const planetGeo = new THREE.SphereGeometry(0.12, 32, 32);
            const planetMat = new THREE.MeshStandardMaterial({ color: 0x88CCFF, emissive: 0x44AAFF });
            const planet = new THREE.Mesh(planetGeo, planetMat);
            scene.add(planet);
            planets.push(planet);
        }
        
        const particleCount = 8000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const radius = 2 + Math.random() * 5;
            const angle = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 5;
            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0x88AACC, size: 0.04, blending: THREE.AdditiveBlending }));
        scene.add(particles);
        
        const starCount = 5000;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i * 3] = (Math.random() - 0.5) * 200;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 100;
            starPositions[i * 3 + 2] = (Math.random() - 0.5) * 100 - 50;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.06, transparent: true, opacity: 0.4 }));
        scene.add(stars);
        
        const ambientLight = new THREE.AmbientLight(0x111122);
        scene.add(ambientLight);
        const coreLight = new THREE.PointLight(0x00FFFF, 1.5, 25);
        coreLight.position.set(0, 0, 0);
        scene.add(coreLight);
        
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            const pulse = 0.9 + Math.sin(time * 4) * 0.1;
            starCore.scale.set(pulse, pulse, pulse);
            coreLight.intensity = 1.0 + Math.sin(time * 5) * 0.4;
            ring1.rotation.z += 0.008;
            ring2.rotation.z -= 0.006;
            ring3.rotation.z += 0.005;
            planets.forEach((planet, i) => {
                const angle = time * 0.5 + (i / planets.length) * Math.PI * 2;
                planet.position.x = Math.cos(angle) * 2.0;
                planet.position.z = Math.sin(angle) * 2.0;
                planet.position.y = Math.sin(angle * 2) * 0.5;
            });
            particles.rotation.y += 0.001;
            stars.rotation.y += 0.0002;
            controls.update();
            effectComposer.render();
        }
        animate();
        
        // Puzzle System
        const symbols = ["🌕", "🌍", "⭐", "🌙", "☄️", "🪐"];
        let score = 0;
        let currentTarget = "";
        let currentOptions = [];
        
        function generatePuzzle() {
            const randomIndex = Math.floor(Math.random() * symbols.length);
            currentTarget = symbols[randomIndex];
            currentOptions = [currentTarget];
            while (currentOptions.length < 4) {
                const rand = symbols[Math.floor(Math.random() * symbols.length)];
                if (!currentOptions.includes(rand)) currentOptions.push(rand);
            }
            for (let i = currentOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentOptions[i], currentOptions[j]] = [currentOptions[j], currentOptions[i]];
            }
            document.getElementById('sequenceDisplay').innerHTML = currentTarget;
            buildOptions();
        }
        
        function buildOptions() {
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            currentOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = opt;
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
        }
        
        function checkAnswer(selected) {
            if (selected === currentTarget) {
                score++;
                document.getElementById('feedback').innerHTML = `<span class="success">✓ CORRECT! Score: ${score}/5</span>`;
                coreLight.intensity = 2.5;
                setTimeout(() => { coreLight.intensity = 1.5; }, 300);
                if (score >= 5) {
                    document.getElementById('feedback').innerHTML = `<span class="success">✨ COSMIC MASTERY ACHIEVED! You have solved the Space Puzzle! ✨</span>`;
                    document.getElementById('options').innerHTML = '';
                    document.getElementById('puzzleText').innerHTML = "🏆 YOU HAVE PASSED THE TRIAL OF COSMOS! 🏆";
                } else {
                    generatePuzzle();
                }
            } else {
                document.getElementById('feedback').innerHTML = `✗ INCORRECT! The correct symbol was ${currentTarget}. Score: ${score}/5`;
                generatePuzzle();
            }
        }
        
        document.getElementById('resetBtn').addEventListener('click', () => { score = 0; document.getElementById('feedback').innerHTML = "Score: 0/5"; generatePuzzle(); });
        document.getElementById('backBtn').addEventListener('click', () => { window.location.href = "gate-hub.html"; });
        
        generatePuzzle();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
