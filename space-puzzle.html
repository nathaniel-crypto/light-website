<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Space Realm | Trial of the Cosmos</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        
        .ui-panel {
            position: fixed;
            bottom: 30px;
            left: 30px;
            right: 30px;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(20px);
            border: 2px solid #00FFFF;
            border-radius: 20px;
            padding: 25px;
            z-index: 100;
            text-align: center;
            max-width: 550px;
            margin: 0 auto;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0,255,255,0.2);
        }
        .puzzle-text { font-size: 1rem; color: #00FFFF; margin-bottom: 15px; letter-spacing: 2px; }
        .sequence-display { 
            font-size: 3rem; 
            letter-spacing: 20px; 
            margin: 20px 0; 
            color: #00FFFF; 
            font-family: monospace;
            text-shadow: 0 0 10px #00FFFF;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 15px;
            transition: transform 0.1s ease;
        }
        .star-rating { margin: 10px 0; font-size: 1.3rem; letter-spacing: 5px; }
        .star { color: #FFD700; text-shadow: 0 0 5px #FFD700; }
        .star-empty { color: #444; }
        .options { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 20px 0; }
        .option-btn { 
            background: rgba(0,255,255,0.15); 
            border: 1px solid #00FFFF; 
            padding: 14px 20px; 
            color: #00FFFF; 
            cursor: pointer; 
            border-radius: 50px; 
            transition: all 0.2s ease; 
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 70px;
        }
        .option-btn:hover { background: #00FFFF; color: #000; transform: scale(1.05); box-shadow: 0 0 20px #00FFFF; }
        .option-btn.disabled { opacity: 0.5; pointer-events: none; }
        .feedback { margin-top: 15px; font-size: 0.85rem; color: #aaa; }
        .success { color: #00ff88; text-shadow: 0 0 5px #00ff88; }
        .fail { color: #FF3366; }
        .title { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 100; }
        .title h1 { font-size: 1.3rem; letter-spacing: 6px; background: linear-gradient(135deg, #00FFFF, #0066FF); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .back-btn { position: fixed; bottom: 30px; right: 30px; background: rgba(0,0,0,0.7); border: 1px solid #00FFFF; padding: 12px 24px; color: #00FFFF; cursor: pointer; z-index: 100; border-radius: 30px; transition: all 0.3s ease; }
        .back-btn:hover { background: rgba(0,255,255,0.2); transform: translateX(-5px); }
        .reset-btn { position: fixed; top: 30px; right: 30px; background: rgba(0,0,0,0.7); border: 1px solid #00FFFF; padding: 8px 16px; color: #00FFFF; cursor: pointer; z-index: 100; border-radius: 20px; font-size: 0.7rem; }
        .progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; margin-top: 15px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00FFFF, #0066FF); transition: width 0.3s ease; border-radius: 3px; }
        @media (max-width: 600px) { 
            .puzzle-text { font-size: 0.8rem; } 
            .option-btn { padding: 8px 12px; font-size: 1rem; min-width: 55px; }
            .sequence-display { font-size: 1.8rem; letter-spacing: 10px; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="title"><h1>🌌 TRIAL OF THE COSMOS 🌌</h1></div>
    <div class="ui-panel" id="puzzlePanel">
        <div class="puzzle-text" id="puzzleText">⚡ MEMORIZE THE COSMIC SEQUENCE ⚡</div>
        <div class="star-rating" id="starRating"></div>
        <div class="sequence-display" id="sequenceDisplay">???</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback">Round 1 of 5 • Watch the sequence...</div>
    </div>
    <button class="reset-btn" id="resetBtn">⟳ RESTART TRIAL</button>
    <button class="back-btn" id="backBtn">← BACK TO HUB</button>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // 3D Environment
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010118);
        scene.fog = new THREE.FogExp2(0x010118, 0.005);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 12);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.2;
        controls.target.set(0, 0, 0);
        
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.3, 0.9);
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // Space environment objects
        const starCoreGeo = new THREE.SphereGeometry(0.8, 128, 128);
        const starCoreMat = new THREE.MeshStandardMaterial({ color: 0x00FFFF, emissive: 0x00FFFF, emissiveIntensity: 0.8 });
        const starCore = new THREE.Mesh(starCoreGeo, starCoreMat);
        scene.add(starCore);
        
        const ring1Geo = new THREE.TorusGeometry(1.4, 0.05, 128, 256);
        const ring1Mat = new THREE.MeshStandardMaterial({ color: 0x00FFFF, emissive: 0x00FFFF });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        scene.add(ring1);
        
        const ring2Geo = new THREE.TorusGeometry(1.9, 0.06, 128, 256);
        const ring2Mat = new THREE.MeshStandardMaterial({ color: 0x33CCFF, emissive: 0x33CCFF });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        scene.add(ring2);
        
        const ring3Geo = new THREE.TorusGeometry(2.4, 0.07, 128, 256);
        const ring3Mat = new THREE.MeshStandardMaterial({ color: 0x66AAFF, emissive: 0x66AAFF });
        const ring3 = new THREE.Mesh(ring3Geo, ring3Mat);
        scene.add(ring3);
        
        const planetCount = 12;
        const planets = [];
        for (let i = 0; i < planetCount; i++) {
            const planetGeo = new THREE.SphereGeometry(0.12, 32, 32);
            const planetMat = new THREE.MeshStandardMaterial({ color: 0x88CCFF, emissive: 0x44AAFF });
            const planet = new THREE.Mesh(planetGeo, planetMat);
            scene.add(planet);
            planets.push(planet);
        }
        
        const particleCount = 8000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const radius = 2 + Math.random() * 5;
            const angle = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 5;
            particlePositions[i * 3] = Math.cos(angle) * radius;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0x88AACC, size: 0.04, blending: THREE.AdditiveBlending }));
        scene.add(particles);
        
        const starCount = 5000;
        const starGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i * 3] = (Math.random() - 0.5) * 200;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 100;
            starPositions[i * 3 + 2] = (Math.random() - 0.5) * 100 - 50;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.06, transparent: true, opacity: 0.4 }));
        scene.add(stars);
        
        const ambientLight = new THREE.AmbientLight(0x111122);
        scene.add(ambientLight);
        const coreLight = new THREE.PointLight(0x00FFFF, 1.5, 25);
        coreLight.position.set(0, 0, 0);
        scene.add(coreLight);
        
        let animTime = 0;
        function animate() {
            requestAnimationFrame(animate);
            animTime += 0.016;
            const pulse = 0.9 + Math.sin(animTime * 4) * 0.1;
            starCore.scale.set(pulse, pulse, pulse);
            coreLight.intensity = 1.0 + Math.sin(animTime * 5) * 0.4;
            ring1.rotation.z += 0.008;
            ring2.rotation.z -= 0.006;
            ring3.rotation.z += 0.005;
            planets.forEach((planet, i) => {
                const angle = animTime * 0.5 + (i / planets.length) * Math.PI * 2;
                planet.position.x = Math.cos(angle) * 2.0;
                planet.position.z = Math.sin(angle) * 2.0;
                planet.position.y = Math.sin(angle * 2) * 0.5;
            });
            particles.rotation.y += 0.001;
            stars.rotation.y += 0.0002;
            controls.update();
            effectComposer.render();
        }
        animate();
        
        // ============================================
        // COSMOS PUZZLE - WORKING
        // ============================================
        
        const symbols = ["🌕", "🌑", "⭐", "🌙", "☄️", "🪐", "🔭", "🌍"];
        
        let currentRound = 1;
        const totalRounds = 5;
        let currentSequence = [];
        let userSequence = [];
        let awaitingInput = false;
        let roundScore = 0;
        let starsEarned = 0;
        let isAnimating = false;
        
        function getSequenceLength() {
            return Math.min(3 + Math.floor(currentRound / 2), 6);
        }
        
        function generateSequence() {
            const length = getSequenceLength();
            currentSequence = [];
            for (let i = 0; i < length; i++) {
                currentSequence.push(Math.floor(Math.random() * symbols.length));
            }
            userSequence = [];
            updateUI();
            document.getElementById('feedback').innerHTML = `Round ${currentRound} of ${totalRounds} • Watch the sequence...`;
            document.getElementById('puzzleText').innerHTML = `🌀 MEMORIZE ${length} SYMBOLS 🌀`;
            displaySequence();
        }
        
        function updateUI() {
            // Update star rating
            const starContainer = document.getElementById('starRating');
            starContainer.innerHTML = '';
            for (let i = 0; i < starsEarned; i++) {
                starContainer.innerHTML += '<span class="star">★</span>';
            }
            for (let i = starsEarned; i < 5; i++) {
                starContainer.innerHTML += '<span class="star-empty">★</span>';
            }
            
            // Update progress
            const progress = (currentRound - 1) / totalRounds * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
        
        function displaySequence() {
            isAnimating = true;
            awaitingInput = false;
            const optionsDiv = document.getElementById('options');
            optionsDiv.style.pointerEvents = 'none';
            optionsDiv.classList.add('disabled');
            
            let i = 0;
            const interval = setInterval(() => {
                if (i >= currentSequence.length) {
                    clearInterval(interval);
                    document.getElementById('sequenceDisplay').innerHTML = "? ? ?";
                    optionsDiv.style.pointerEvents = 'auto';
                    optionsDiv.classList.remove('disabled');
                    awaitingInput = true;
                    isAnimating = false;
                    document.getElementById('feedback').innerHTML = `Round ${currentRound} • Enter the sequence (${currentSequence.length} symbols)`;
                    return;
                }
                const symbolIndex = currentSequence[i];
                document.getElementById('sequenceDisplay').innerHTML = symbols[symbolIndex];
                document.getElementById('sequenceDisplay').style.transform = 'scale(1.1)';
                setTimeout(() => {
                    document.getElementById('sequenceDisplay').style.transform = 'scale(1)';
                }, 200);
                
                coreLight.intensity = 2.5;
                setTimeout(() => { coreLight.intensity = 1.5; }, 200);
                i++;
            }, 900);
        }
        
        function buildOptions() {
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            // Show all symbols as options
            symbols.forEach((sym, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = sym;
                btn.onclick = () => handleUserInput(idx);
                optionsDiv.appendChild(btn);
            });
        }
        
        function handleUserInput(selectedIndex) {
            if (!awaitingInput || isAnimating) return;
            
            userSequence.push(selectedIndex);
            const currentPosition = userSequence.length - 1;
            
            // Visual feedback
            coreLight.intensity = 2.0;
            setTimeout(() => { coreLight.intensity = 1.5; }, 150);
            
            if (selectedIndex !== currentSequence[currentPosition]) {
                // WRONG - Game over
                document.getElementById('feedback').innerHTML = `<span class="fail">❌ INCORRECT! The correct symbol was ${symbols[currentSequence[currentPosition]]}. Trial Failed. ❌</span>`;
                document.getElementById('options').style.pointerEvents = 'none';
                awaitingInput = false;
                coreLight.intensity = 0.5;
                setTimeout(() => { coreLight.intensity = 1.5; }, 500);
                return;
            }
            
            document.getElementById('feedback').innerHTML = `✅ ${userSequence.length}/${currentSequence.length} correct • Keep going!`;
            
            if (userSequence.length === currentSequence.length) {
                // ROUND COMPLETE
                roundScore++;
                starsEarned = Math.min(5, Math.floor(roundScore / 1.5));
                updateUI();
                
                if (currentRound >= totalRounds) {
                    // VICTORY!
                    document.getElementById('feedback').innerHTML = `<span class="success">✨✨✨ COSMIC MASTERY ACHIEVED! Gate Complete! ✨✨✨</span>`;
                    document.getElementById('options').innerHTML = '';
                    document.getElementById('puzzleText').innerHTML = "🏆 YOU HAVE PASSED THE TRIAL OF THE COSMOS! 🏆";
                    document.getElementById('sequenceDisplay').innerHTML = "🌟 VICTORY 🌟";
                    coreLight.intensity = 3.0;
                    bloomPass.strength = 2.0;
                    awaitingInput = false;
                    
                    // Mark gate as completed
                    let completedGates = JSON.parse(localStorage.getItem('completedGates') || '{"ancient":false,"mystical":false,"space":false}');
                    completedGates.space = true;
                    localStorage.setItem('completedGates', JSON.stringify(completedGates));
                    // Trigger storage event for other tabs
                    window.dispatchEvent(new StorageEvent('storage', { key: 'completedGates', newValue: JSON.stringify(completedGates) }));
                    return;
                } else {
                    currentRound++;
                    generateSequence();
                    setTimeout(() => buildOptions(), 1000);
                }
            }
        }
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            currentRound = 1;
            roundScore = 0;
            starsEarned = 0;
            generateSequence();
            buildOptions();
            coreLight.intensity = 1.5;
            bloomPass.strength = 1.4;
            // Reset completion status for this gate
            let completedGates = JSON.parse(localStorage.getItem('completedGates') || '{"ancient":false,"mystical":false,"space":false}');
            completedGates.space = false;
            localStorage.setItem('completedGates', JSON.stringify(completedGates));
            window.dispatchEvent(new StorageEvent('storage', { key: 'completedGates', newValue: JSON.stringify(completedGates) }));
        });
        
        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = "gate-hub.html";
        });
        
        // Initialize
        buildOptions();
        generateSequence();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
